apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "nas-admin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nas-admin.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "nas-admin.fullname" . }}
          port: {{ include "nas-admin.servicePort" . }}

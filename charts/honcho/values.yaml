# Default values for honcho.
# This is a YAML-formatted file.

# Global settings
hostname: "honcho.cluster.home"
nodeSelector:
  kubernetes.io/hostname: "srv-rk1-nvme-02"
tolerations:
  - operator: Exists

# API Server and Deriver Worker configuration
image:
  repository: "ghcr.io/plastic-labs/honcho"
  tag: "v3.0.12"
  pullPolicy: "IfNotPresent"

# LiteLLM Integration parameters (OpenAI compatible)
# All Honcho components (Deriver, Summary, Dream, Dialectic, Embedding)
# are forced to openai transport routed through in-cluster LiteLLM.
llm:
  # 14/07: OpenRouter DIRECTO con key propia por-consumidor (leloir-bench-honcho) →
  # trazabilidad por-key en OpenRouter. El litellm-proxy in-cluster quedó descartado
  # para honcho: sin DB solo acepta la master key (sk-hermes-internal = "No connected db").
  baseUrl: "https://openrouter.ai/api/v1"
  apiKey: ""   # NO commitear una real; preferir existingKeySecret (abajo)
  # Key desde un Secret ya existente en el ns (env LLM_OPENAI_API_KEY via secretKeyRef;
  # pisa a la del secret del chart). Creada con la provisioning key de OpenRouter.
  existingKeySecret:
    name: ""              # ej: leloir-bench-honcho-key
    key: "OPENAI_API_KEY"
  # Modelo REAL (naming OpenRouter). VERIFICADO 14/07: el deriver con claude-sonnet-5
  # produce 9 observaciones; los free-tier (hermes-qwen/kimi-free) derivan "zero
  # observations" (structured output débil) → el deriver necesita un modelo fuerte.
  model: "anthropic/claude-sonnet-5"
  # Deriver: derivar INMEDIATO por mensaje (sin esperar el batch de 512 tokens / 30 min).
  # Para memoria de incidentes cada captura debe derivar al toque; el default upstream
  # (FLUSH_ENABLED=false + REPRESENTATION_BATCH_MAX_AGE_SECONDS=1800) parece "deriver muerto".
  deriverFlushEnabled: "true"
  # Embedding vía el mismo baseUrl/key (naming OpenRouter: openai/text-embedding-3-small).
  embeddingModel: "openai/text-embedding-3-small"
  embedMessages: "true"

# ── Telemetry (OTEL/CloudEvents → collector) ─────────────────────────────────
# Honcho has NO Prometheus /metrics endpoint. Observability goes through its
# built-in telemetry emitter (CloudEvents over OTLP HTTP). Point it at the
# cluster's OTEL collector (Grafana Alloy) → Prometheus/Tempo. Off by default.
telemetry:
  enabled: false
  endpoint: "http://alloy.monitoring.svc.cluster.local:4318"

# Database config (pgvector)
postgresql:
  image:
    repository: "pgvector/pgvector"
    tag: "pg16"
    pullPolicy: "Always"
  persistence:
    storageClass: "longhorn-nvme"
    size: "10Gi"
  dbName: "honcho"
  dbUser: "honcho"
  dbPassword: "honchosecretpassword"

# Redis Cache config (fast queues)
redis:
  image:
    repository: "redis"
    tag: "7-alpine"
    pullPolicy: "Always"

# Auth — JWT-based authentication
# Set useAuth: "true" and provide jwtSecret to enable workspace-scoped API keys.
auth:
  useAuth: "false"
  jwtSecret: ""

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "honcho.fullname" . }}
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: gateway
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "honcho.fullname" . }}-api
          port: 80

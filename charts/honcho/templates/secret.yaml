apiVersion: v1
kind: Secret
metadata:
  name: {{ include "honcho.fullname" . }}-secrets
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── Database ────────────────────────────────────────────────────────────────
  # MUST use postgresql+psycopg:// (honcho uses psycopg3, NOT asyncpg)
  DB_CONNECTION_URI: "postgresql+psycopg://{{ .Values.postgresql.dbUser }}:{{ .Values.postgresql.dbPassword }}@{{ include "honcho.fullname" . }}-postgres:5432/{{ .Values.postgresql.dbName }}"

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  CACHE_URL: "redis://{{ include "honcho.fullname" . }}-redis:6379/0?suppress=true"
  CACHE_ENABLED: "true"

  # ── Auth ────────────────────────────────────────────────────────────────────
  AUTH_USE_AUTH: {{ .Values.auth.useAuth | quote }}
  {{- if .Values.auth.jwtSecret }}
  AUTH_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  {{- end }}
  LOG_LEVEL: "INFO"

  # ── Embeddings: disabled (no embedding model in LiteLLM) ────────────────────
  EMBED_MESSAGES: {{ .Values.llm.embedMessages | quote }}

  # ── LLM API Keys ────────────────────────────────────────────────────────────
  # openai transport key → picked up by AsyncOpenAI client in clients.py
  LLM_OPENAI_API_KEY: {{ .Values.llm.apiKey | quote }}

  # ── Deriver (env_prefix="DERIVER_") ─────────────────────────────────────────
  DERIVER_PROVIDER: "openai"
  DERIVER_MODEL: {{ .Values.llm.model | quote }}
  DERIVER_OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}

  # ── Summary (env_prefix="SUMMARY_") ─────────────────────────────────────────
  SUMMARY_PROVIDER: "openai"
  SUMMARY_MODEL: {{ .Values.llm.model | quote }}
  SUMMARY_OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}

  # ── Dream (env_prefix="DREAM_") ─────────────────────────────────────────────
  DREAM_PROVIDER: "openai"
  DREAM_MODEL: {{ .Values.llm.model | quote }}
  DREAM_OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}

  # ── Dialectic levels (env_prefix="DIALECTIC_", env_nested_delimiter="__") ───
  # Override all 5 reasoning levels to use openai via LiteLLM proxy.
  # Uses JSON override format for the nested LEVELS dict.
  DIALECTIC_LEVELS: |
    {
      "minimal": {"provider": "openai", "model": {{ .Values.llm.model | quote }}, "thinking_budget_tokens": 0, "max_tool_iterations": 1, "max_output_tokens": 250, "tool_choice": "any"},
      "low":     {"provider": "openai", "model": {{ .Values.llm.model | quote }}, "thinking_budget_tokens": 0, "max_tool_iterations": 5, "tool_choice": "any"},
      "medium":  {"provider": "openai", "model": {{ .Values.llm.model | quote }}, "thinking_budget_tokens": 0, "max_tool_iterations": 2},
      "high":    {"provider": "openai", "model": {{ .Values.llm.model | quote }}, "thinking_budget_tokens": 0, "max_tool_iterations": 4},
      "max":     {"provider": "openai", "model": {{ .Values.llm.model | quote }}, "thinking_budget_tokens": 0, "max_tool_iterations": 10}
    }
  DIALECTIC_OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}

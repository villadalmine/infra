apiVersion: v1
kind: Secret
metadata:
  name: {{ include "honcho.fullname" . }}-secrets
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── Database ────────────────────────────────────────────────────────────────
  # MUST use postgresql+psycopg:// (honcho uses psycopg3, NOT asyncpg)
  DB_CONNECTION_URI: "postgresql+psycopg://{{ .Values.postgresql.dbUser }}:{{ .Values.postgresql.dbPassword }}@{{ include "honcho.fullname" . }}-postgres:5432/{{ .Values.postgresql.dbName }}"

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  CACHE_URL: "redis://{{ include "honcho.fullname" . }}-redis:6379/0?suppress=true"
  CACHE_ENABLED: "true"

  # ── Auth ────────────────────────────────────────────────────────────────────
  AUTH_USE_AUTH: "false"
  LOG_LEVEL: "INFO"

  # ── Embeddings: disabled (no embedding model in LiteLLM) ────────────────────
  # Set EMBED_MESSAGES=true and configure embeddingModel in values.yaml to enable
  EMBED_MESSAGES: {{ .Values.llm.embedMessages | quote }}

  # ── LLM API Key → used by ALL components via LiteLLM proxy ──────────────────
  LLM_OPENAI_API_KEY: {{ .Values.llm.apiKey | quote }}

  # ── Global model default → LiteLLM proxy (openai transport) ─────────────────
  MODEL_CONFIG__TRANSPORT: "openai"
  MODEL_CONFIG__MODEL: {{ .Values.llm.model | quote }}
  MODEL_CONFIG__OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}

  # ── Deriver (memory extraction background worker) ───────────────────────────
  DERIVER__TRANSPORT: "openai"
  DERIVER__MODEL: {{ .Values.llm.model | quote }}
  DERIVER__OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}

  # ── Summary (session summarisation) ─────────────────────────────────────────
  SUMMARY__TRANSPORT: "openai"
  SUMMARY__MODEL: {{ .Values.llm.model | quote }}
  SUMMARY__OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}

  # ── Dream (long-term memory consolidation) ───────────────────────────────────
  DREAM__TRANSPORT: "openai"
  DREAM__MODEL: {{ .Values.llm.model | quote }}
  DREAM__OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}

  # ── Dialectic (agent chat interface) ────────────────────────────────────────
  DIALECTIC__TRANSPORT: "openai"
  DIALECTIC__MODEL: {{ .Values.llm.model | quote }}
  DIALECTIC__OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}

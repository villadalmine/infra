apiVersion: v1
kind: Secret
metadata:
  name: {{ include "honcho.fullname" . }}-secrets
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ── Database ────────────────────────────────────────────────────────────────
  # MUST use postgresql+psycopg:// (honcho uses psycopg3, NOT asyncpg)
  DB_CONNECTION_URI: "postgresql+psycopg://{{ .Values.postgresql.dbUser }}:{{ .Values.postgresql.dbPassword }}@{{ include "honcho.fullname" . }}-postgres:5432/{{ .Values.postgresql.dbName }}"

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  CACHE_URL: "redis://{{ include "honcho.fullname" . }}-redis:6379/0?suppress=true"
  CACHE_ENABLED: "true"

  # ── Auth ────────────────────────────────────────────────────────────────────
  AUTH_USE_AUTH: {{ .Values.auth.useAuth | quote }}
  {{- if .Values.auth.jwtSecret }}
  AUTH_JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  {{- end }}
  LOG_LEVEL: "INFO"

  # ── Embeddings (env_prefix="EMBEDDING_", nested "__") ───────────────────────
  # SIN estas keys el search/chat da 500 (el upgrade del 14/07 las perdió porque
  # vivían solo como patch manual — lección: todo lo vivo va en el template).
  EMBED_MESSAGES: {{ .Values.llm.embedMessages | quote }}
  EMBEDDING_MODEL_CONFIG__MODEL: {{ .Values.llm.embeddingModel | quote }}
  EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}
  EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: "LLM_OPENAI_API_KEY"
  OPENAI_BASE_URL: {{ .Values.llm.baseUrl | quote }}

  # ── Telemetry (env_prefix="TELEMETRY_") → OTEL collector (Alloy) ────────────
  # Honcho emits CloudEvents over OTLP HTTP; no Prometheus /metrics endpoint.
  {{- if .Values.telemetry.enabled }}
  TELEMETRY_ENABLED: "true"
  TELEMETRY_ENDPOINT: {{ .Values.telemetry.endpoint | quote }}
  {{- end }}

  # ── LLM API Keys ────────────────────────────────────────────────────────────
  # openai transport key → picked up by AsyncOpenAI client in clients.py
  LLM_OPENAI_API_KEY: {{ .Values.llm.apiKey | quote }}

  # ── Modelos por componente — SCHEMA v3.0.12 REAL ────────────────────────────
  # OJO (bug cazado 14/07 en el dashboard de OpenRouter): los settings de honcho
  # v3 anidan el modelo en MODEL_CONFIG (env <PREFIX>_MODEL_CONFIG__MODEL). Los
  # nombres viejos (DERIVER_MODEL, DIALECTIC_LEVELS formato v2) se IGNORAN en
  # silencio (extra="ignore") y cada componente cae a su DEFAULT interno
  # (gpt-5.4-mini) — con OpenRouter directo eso es el GPT-5.4 Mini REAL de
  # OpenAI, no el modelo pineado. Verificar SIEMPRE per-call en el activity.
  DERIVER_MODEL_CONFIG__MODEL: {{ .Values.llm.model | quote }}
  DERIVER_MODEL_CONFIG__TRANSPORT: "openai"
  DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}
  DERIVER_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: "LLM_OPENAI_API_KEY"
  # Sin esto el deriver batchea (512 tokens o 30 min) y las capturas cortas de
  # incidentes quedan pendientes media hora — parece roto sin estarlo.
  DERIVER_FLUSH_ENABLED: {{ .Values.llm.deriverFlushEnabled | default "true" | quote }}

  SUMMARY_MODEL_CONFIG__MODEL: {{ .Values.llm.model | quote }}
  SUMMARY_MODEL_CONFIG__TRANSPORT: "openai"
  SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}
  SUMMARY_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: "LLM_OPENAI_API_KEY"

  DREAM_MODEL_CONFIG__MODEL: {{ .Values.llm.model | quote }}
  DREAM_MODEL_CONFIG__TRANSPORT: "openai"
  DREAM_MODEL_CONFIG__OVERRIDES__BASE_URL: {{ .Values.llm.baseUrl | quote }}
  DREAM_MODEL_CONFIG__OVERRIDES__API_KEY_ENV: "LLM_OPENAI_API_KEY"

  # ── Dialectic levels — schema v3: cada nivel = {MODEL_CONFIG:{...}, ...} ────
  # El env reemplaza el dict ENTERO → se declaran los 5 niveles.
  DIALECTIC_LEVELS: |
    {
      {{- $m := .Values.llm.model }}{{- $b := .Values.llm.baseUrl }}
      "minimal": {"MODEL_CONFIG": {"model": {{ $m | quote }}, "transport": "openai", "overrides": {"base_url": {{ $b | quote }}, "api_key_env": "LLM_OPENAI_API_KEY"}}, "MAX_TOOL_ITERATIONS": 1, "MAX_OUTPUT_TOKENS": 250, "TOOL_CHOICE": "required"},
      "low":     {"MODEL_CONFIG": {"model": {{ $m | quote }}, "transport": "openai", "overrides": {"base_url": {{ $b | quote }}, "api_key_env": "LLM_OPENAI_API_KEY"}}, "MAX_TOOL_ITERATIONS": 5, "TOOL_CHOICE": "required"},
      "medium":  {"MODEL_CONFIG": {"model": {{ $m | quote }}, "transport": "openai", "overrides": {"base_url": {{ $b | quote }}, "api_key_env": "LLM_OPENAI_API_KEY"}}, "MAX_TOOL_ITERATIONS": 2},
      "high":    {"MODEL_CONFIG": {"model": {{ $m | quote }}, "transport": "openai", "overrides": {"base_url": {{ $b | quote }}, "api_key_env": "LLM_OPENAI_API_KEY"}}, "MAX_TOOL_ITERATIONS": 4},
      "max":     {"MODEL_CONFIG": {"model": {{ $m | quote }}, "transport": "openai", "overrides": {"base_url": {{ $b | quote }}, "api_key_env": "LLM_OPENAI_API_KEY"}}, "MAX_TOOL_ITERATIONS": 10}
    }

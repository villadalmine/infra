apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honcho.fullname" . }}-worker
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
    app: {{ include "honcho.fullname" . }}-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "honcho.selectorLabels" . | nindent 6 }}
      app: {{ include "honcho.fullname" . }}-worker
  template:
    metadata:
      labels:
        {{- include "honcho.selectorLabels" . | nindent 8 }}
        app: {{ include "honcho.fullname" . }}-worker
    spec:
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: honcho-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python"]
          args: ["-m", "src.deriver"]
          envFrom:
            - secretRef:
                name: {{ include "honcho.fullname" . }}-secrets

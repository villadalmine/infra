apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honcho.fullname" . }}-worker
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
    app: {{ include "honcho.fullname" . }}-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "honcho.selectorLabels" . | nindent 6 }}
      app: {{ include "honcho.fullname" . }}-worker
  template:
    metadata:
      labels:
        {{- include "honcho.selectorLabels" . | nindent 8 }}
        app: {{ include "honcho.fullname" . }}-worker
    spec:
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-api
          image: "busybox:latest"
          command: ['sh', '-c', 'until wget -qO- http://{{ include "honcho.fullname" . }}-api/health > /dev/null 2>&1; do echo "waiting for honcho-api..."; sleep 5; done']
      containers:
        - name: honcho-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python"]
          args: ["-m", "src.deriver"]
          envFrom:
            - secretRef:
                name: {{ include "honcho.fullname" . }}-secrets
          {{- if .Values.llm.existingKeySecret.name }}
          env:
            - name: LLM_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.existingKeySecret.name | quote }}
                  key: {{ .Values.llm.existingKeySecret.key | quote }}
          {{- end }}

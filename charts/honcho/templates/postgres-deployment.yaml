apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "honcho.fullname" . }}-postgres-pvc
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honcho.fullname" . }}-postgres
  labels:
    {{- include "honcho.labels" . | nindent 4 }}
    app: {{ include "honcho.fullname" . }}-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "honcho.selectorLabels" . | nindent 6 }}
      app: {{ include "honcho.fullname" . }}-postgres
  template:
    metadata:
      labels:
        {{- include "honcho.selectorLabels" . | nindent 8 }}
        app: {{ include "honcho.fullname" . }}-postgres
    spec:
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.dbName | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.dbUser | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.dbPassword | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ include "honcho.fullname" . }}-postgres-pvc

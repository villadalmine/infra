# Build Hermes Agent ARM64 image using kaniko in-cluster.
# Clones the hermes-agent repo, builds with kaniko, pushes to local registry.

- name: Ensure custom Storage backend is installed before running Hermes Agent image build
  ansible.builtin.include_role:
    name: "{{ kaniko_storage_role }}"
  when: kaniko_storage_class != 'local-path' and kaniko_storage_role is defined

- name: Create kaniko namespace
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ kaniko_namespace }}"
    state: present

- name: Create ConfigMap with Hermes Dockerfile
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: hermes-dockerfile
        namespace: "{{ kaniko_namespace }}"
      data:
        Dockerfile: |
          {{ lookup('template', 'Dockerfile.j2') }}

- name: Create kaniko PVC for build cache
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: kaniko-cache
        namespace: "{{ kaniko_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ kaniko_storage_class }}"
        resources:
          requests:
            storage: "{{ kaniko_storage_size }}"



- name: Create Argo Workflow for Kaniko build
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Workflow
      metadata:
        generateName: build-hermes-arm64-
        namespace: "{{ kaniko_namespace }}"
        labels:
          app: hermes-agent-build
      spec:
        entrypoint: build-image
        nodeSelector:
          kubernetes.io/hostname: "{{ kaniko_node_hostname }}"
        tolerations:
          - key: "node.kubernetes.io/unreachable"
            operator: Exists
            effect: NoExecute
          - key: "node.kubernetes.io/not-ready"
            operator: Exists
            effect: NoExecute
        volumeClaimTemplates:
          - metadata:
              name: workspace
            spec:
              accessModes: [ "ReadWriteOnce" ]
              storageClassName: "{{ kaniko_workspace_storage_class }}"
              resources:
                requests:
                  storage: "{{ kaniko_workspace_storage_size }}"
        volumes:
          - name: dockerfile
            configMap:
              name: hermes-dockerfile
          - name: cache
            persistentVolumeClaim:
              claimName: kaniko-cache
        templates:
          - name: build-image
            inputs:
              artifacts:
                - name: source
                  path: /workspace/source
                  git:
                    repo: "{{ hermes_git_repo }}"
                    revision: "{{ hermes_git_ref }}"
                    depth: 1
            container:
              image: gcr.io/kaniko-project/executor:latest
              args:
                - "--dockerfile=/workspace/source/Dockerfile"
                - "--context=dir:///workspace/source"
                - "--cache=true"
                - "--cache-dir=/cache"
                - "--destination={{ hermes_registry }}/{{ hermes_image_name }}:{{ hermes_image_tag }}"
                - "--insecure"
                - "--skip-tls-verify"
                - "--snapshot-mode=redo"
                - "--compression=zstd"
                - "--compression-level=1"
              resources:
                requests:
                  cpu: "1"
                  memory: "8Gi"
                limits:
                  cpu: "4"
                  memory: "20Gi"
              volumeMounts:
                - name: dockerfile
                  mountPath: /workspace/source/Dockerfile
                  subPath: Dockerfile
                - name: cache
                  mountPath: /cache
                - name: workspace
                  mountPath: /workspace

- name: Build triggered!
  ansible.builtin.debug:
    msg: "The Argo Workflow for hermes-agent has been submitted. Check the Argo UI to monitor the progress."

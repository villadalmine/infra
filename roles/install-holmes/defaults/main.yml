# 0.35.0 (2026-07): trae operator mode (HC/SHC/THC), mcp_servers y
# customClusterRoleRules en values. Salto desde 0.24.0 verificado: schema de
# values compatible (modelList/toolsets/crdPermissions/additionalEnvVars).
holmes_version: "0.35.0"

# Operator mode (0.35): despliega el controller holmes-operator que reconcilia
# los CRDs HealthCheck / ScheduledHealthCheck / TriggeredHealthCheck. Sin esto
# los CRDs existen pero nadie los actúa. Imagen robustadev/holmes-operator
# (multi-arch arm64+amd64). Reversible: false = no despliega el controller.
holmes_operator_enabled: true

# El combined-server AG-UI (holmes-combined-server.py) fue escrito contra el
# server.py de 0.24 y NO es compatible con 0.35 (auth middleware/admin API
# nuevos; delta de ~337 líneas). holmes-ui usa /api/chat estándar y NO lo
# necesita. Re-habilitar requiere portar el archivo al layout 0.35.
holmes_agui_patch: false
holmes_namespace: ai
holmes_hostname: holmes.cluster.home

holmes_release_name: holmesgpt
holmes_model_name: "openai/rk1-npu-local"
holmes_openai_base: "http://litellm-proxy.ai.svc.cluster.local:4000/v1"
holmes_openai_key: "sk-hermes-internal"

holmes_additional_env:
  - name: OPENAI_API_BASE
    value: "http://litellm-proxy.ai.svc.cluster.local:4000/v1"
  - name: OPENAI_API_KEY
    value: "sk-hermes-internal"
  - name: HOLMES_CONFIGPATH_DIR
    value: "/tmp/.holmes"

holmes_cpu_limit: "4000m"
holmes_cpu_request: "1000m"
holmes_memory_limit: "8Gi"
holmes_memory_request: "2Gi"

holmes_node_hostname: "srv-rk1-nvme-01"

---
# Prometheus Pushgateway + ServiceMonitor para que kube-prometheus-stack lo scrapee.
# `honorLabels: true` es CLAVE: la Pushgateway re-exporta las series con sus propios job/instance;
# sin honor_labels, Prometheus los pisaría con los del scrape y se mezclarían los pushers.

- name: Deploy Pushgateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pushgateway
        namespace: "{{ pushgateway_namespace }}"
        labels:
          app.kubernetes.io/name: pushgateway
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: pushgateway
        template:
          metadata:
            labels:
              app.kubernetes.io/name: pushgateway
          spec:
            containers:
              - name: pushgateway
                image: "{{ pushgateway_image }}"
                # --persistence: sobrevive reinicios del pod (las métricas pushadas no se pierden).
                args: ["--persistence.file=/data/pushgateway.store",
                       "--persistence.interval=5m"]
                ports:
                  - { name: metrics, containerPort: "{{ pushgateway_port }}" }
                resources:
                  requests: { cpu: "10m", memory: "32Mi" }
                  limits: { cpu: "200m", memory: "128Mi" }
                volumeMounts:
                  - { name: data, mountPath: /data }
                readinessProbe:
                  httpGet: { path: /-/ready, port: metrics }
                livenessProbe:
                  httpGet: { path: /-/healthy, port: metrics }
            volumes:
              - { name: data, emptyDir: {} }

- name: Expose Pushgateway Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: pushgateway
        namespace: "{{ pushgateway_namespace }}"
        labels:
          app.kubernetes.io/name: pushgateway
      spec:
        selector:
          app.kubernetes.io/name: pushgateway
        ports:
          - { name: metrics, port: "{{ pushgateway_port }}", targetPort: metrics }

- name: ServiceMonitor for Pushgateway (scraped by kube-prometheus-stack)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: pushgateway
        namespace: "{{ pushgateway_namespace }}"
        labels:
          # kube-prometheus-stack (serviceMonitorSelectorNilUsesHelmValues) solo toma las
          # ServiceMonitor con el label del release.
          release: "{{ pushgateway_prometheus_release }}"
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: pushgateway
        endpoints:
          - port: metrics
            interval: 30s
            honorLabels: true   # respetar job/instance que vienen de los pushers

---
- name: Label RK1 nodes for Longhorn
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ item }}"
        labels:
          storage: rk1-longhorn
          node.longhorn.io/create-default-disk: "config"
        annotations:
          node.longhorn.io/default-disks-config: '[{"name":"nvme-fs","path":"/mnt/nvme","allowScheduling":true,"tags":["nvme"],"diskType":"filesystem"}]'
  loop: "{{ groups['rk1_nodes'] | default([]) }}"

# Single-disk / hypervisor nodes (srv-t7910): the Longhorn data dir lives ON the root filesystem
# (no dedicated device). Longhorn keys disks by filesystem UUID and refuses two disks on the same
# FS (DiskFilesystemChanged). So we do NOT add our own dir disk — that collides with the default
# disk Longhorn already maintains at defaultDataPath. Instead we let Longhorn create its single
# default disk (create-default-disk=true) and then TAG that disk nvme + set reserved (task below).
- name: Label single-disk/hypervisor nodes for Longhorn (single default disk on the shared root FS)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ item }}"
        labels:
          storage: rk1-longhorn                          # → longhorn-manager corre acá = nodo Longhorn (puede attachear)
          node.longhorn.io/create-default-disk: "true"   # auto default disk at defaultDataPath (/var/lib/longhorn); no second disk
  loop: "{{ groups['longhorn_dir_nodes'] | default([]) }}"

- name: Ensure longhorn-csi-plugin DaemonSet runs on all nodes (Helm does not update nodeSelector reliably)
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: longhorn-csi-plugin
        namespace: "{{ longhorn_namespace }}"
      spec:
        template:
          spec:
            nodeSelector: {}

- name: Wait for Longhorn to register nodes after Helm install
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Node
    namespace: "{{ longhorn_namespace }}"
    name: "{{ item }}"
  register: lh_node_check
  until: lh_node_check.resources | length > 0
  retries: 20
  delay: 10
  loop: "{{ groups['rk1_nodes'] | default([]) }}"

- name: Ensure nvme-fs disk is registered on each Longhorn node
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: longhorn.io/v1beta2
      kind: Node
      metadata:
        name: "{{ item }}"
        namespace: "{{ longhorn_namespace }}"
      spec:
        disks:
          nvme-fs:
            allowScheduling: true
            diskDriver: ""
            diskType: filesystem
            evictionRequested: false
            path: /mnt/nvme
            storageReserved: 0
            tags:
              - nvme
  loop: "{{ groups['rk1_nodes'] | default([]) }}"

- name: Wait for Longhorn to register single-disk/hypervisor nodes (and their default disk)
  kubernetes.core.k8s_info:
    api_version: longhorn.io/v1beta2
    kind: Node
    namespace: "{{ longhorn_namespace }}"
    name: "{{ item }}"
  register: lh_dir_node_check
  until:
    - lh_dir_node_check.resources | length > 0
    - lh_dir_node_check.resources[0].spec.disks | dict2items | selectattr('key', 'match', 'default-disk-') | list | length > 0
  retries: 30
  delay: 10
  loop: "{{ groups['longhorn_dir_nodes'] | default([]) }}"

# One disk per filesystem: tag Longhorn's own default disk (on the root FS) with nvme + set
# storageReserved, and delete any duplicate dir disk we created in earlier runs (merge patch,
# null deletes the key). This is what lets the longhorn-vm StorageClass (diskSelector: nvme)
# keep a local VM-disk replica on the hypervisor without a DiskFilesystemChanged collision.
- name: Tag the default Longhorn disk (nvme) + reserve, drop duplicate dir disk (hypervisor nodes)
  kubernetes.core.k8s:
    state: patched
    merge_type: merge
    definition:
      apiVersion: longhorn.io/v1beta2
      kind: Node
      metadata:
        name: "{{ item.item }}"
        namespace: "{{ longhorn_namespace }}"
      spec:
        disks: "{{ _patch_disks }}"
  vars:
    _disks_now: "{{ item.resources[0].spec.disks }}"
    _default_name: "{{ _disks_now | dict2items | selectattr('key', 'match', 'default-disk-') | map(attribute='key') | first }}"
    _default_patched: "{{ _disks_now[_default_name] | combine({'allowScheduling': true, 'storageReserved': longhorn_dir_reserved_bytes | int, 'tags': longhorn_dir_tags}) }}"
    _patch_disks: "{{ {_default_name: _default_patched} | combine({'local-dir': none} if 'local-dir' in _disks_now else {}) }}"
  loop: "{{ lh_dir_node_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  # On a freshly registered node the disk spec/status is still syncing and the longhorn
  # validating webhook rejects edits ("disks ... are being syncing, retry later", 403).
  register: lh_dir_disk_patch
  until: lh_dir_disk_patch is succeeded
  retries: 12
  delay: 10

- name: Add Longhorn Helm repository
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: "https://charts.longhorn.io"

- name: Render Longhorn values
  template:
    src: longhorn-values.yaml.j2
    dest: /tmp/longhorn-values.yaml

- name: Install or upgrade Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    release_namespace: "{{ longhorn_namespace }}"
    values_files:
      - /tmp/longhorn-values.yaml
    chart_version: "{{ longhorn_chart_version }}"
    wait: true
    timeout: 600s

- name: Ensure built-in longhorn StorageClass is not default (local-path stays default)
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: longhorn
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"

- name: Remove old longhorn-v2 StorageClass if it exists
  kubernetes.core.k8s:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: longhorn-v2
    state: absent

- name: Ensure V2 data engine is disabled (Helm upgrades do not overwrite Settings)
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: longhorn.io/v1beta2
      kind: Setting
      metadata:
        name: v2-data-engine
        namespace: "{{ longhorn_namespace }}"
      value: "false"

- name: Render Longhorn StorageClass
  template:
    src: storageclass-v2.yaml.j2
    dest: /tmp/longhorn-storageclass.yaml

# StorageClass.parameters are immutable: if the rendered SC changed a parameter (e.g. adding
# diskSelector: nvme), a plain apply fails with "updates to parameters are forbidden". Recreate
# it on that failure. Idempotent: in steady state the apply succeeds and the rescue never runs.
- name: Apply Longhorn StorageClass (recreate when parameters changed)
  block:
    - name: Apply Longhorn StorageClass
      kubernetes.core.k8s:
        state: present
        src: /tmp/longhorn-storageclass.yaml
  rescue:
    - name: Delete existing StorageClass (parameters are immutable)
      kubernetes.core.k8s:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: longhorn-nvme
        state: absent
    - name: Recreate Longhorn StorageClass with new parameters
      kubernetes.core.k8s:
        state: present
        src: /tmp/longhorn-storageclass.yaml

- name: Render fio benchmark pod
  template:
    src: fio-benchmark.yaml.j2
    dest: /tmp/longhorn-benchmark.yaml
  when: longhorn_run_benchmark | bool

- name: Apply fio benchmark pod and PVC
  kubernetes.core.k8s:
    state: present
    src: /tmp/longhorn-benchmark.yaml
  when: longhorn_run_benchmark | bool

- name: Wait for benchmark pod to complete
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    name: longhorn-nvme-bench
    namespace: default
  register: bench_pod
  until: bench_pod.resources[0].status.phase in ['Succeeded', 'Failed']
  retries: 40
  delay: 15
  when: longhorn_run_benchmark | bool

- name: Print benchmark results
  ansible.builtin.command: kubectl logs -n default longhorn-nvme-bench
  register: bench_logs
  changed_when: false
  when: longhorn_run_benchmark | bool

- name: Show benchmark output
  ansible.builtin.debug:
    msg: "{{ bench_logs.stdout_lines }}"
  when: longhorn_run_benchmark | bool

- name: Delete benchmark pod and PVC
  kubernetes.core.k8s:
    state: absent
    src: /tmp/longhorn-benchmark.yaml
  when: longhorn_run_benchmark | bool

# install-k3s — idempotent K3s deployment with an HA control plane
# (3 masters, embedded etcd) and HAProxy-VIP-registered agents.
#
# Node role is driven entirely by inventory groups:
#   server_nodes[0]    → the SINGLE cluster-init node (bootstraps embedded etcd)
#   server_join_nodes  → additional control-plane nodes (join the etcd cluster)
#   agent_nodes        → workers; register through the HAProxy VIP for HA
#
# Idempotency is STATE-based, not flag-based — re-runs converge to changed=0:
#   - init migrates SQLite→etcd only while .../db/etcd/member is absent
#   - join wipes+joins only while the node is not already a Ready cluster member
#   - agent (re)installs only when inactive or not yet pointing at the VIP
#
# See CLAUDE.md "Bootstrap role order" and skills/k3s/SKILL.md.

# ----------------------------------------------------------------------------
# Common host prep (every k3s node)
# ----------------------------------------------------------------------------
- name: Populate service facts
  ansible.builtin.service_facts:

- name: Establecer el hostname usando hostnamectl
  ansible.builtin.command: "hostnamectl set-hostname {{ inventory_hostname }}"
  become: true
  changed_when: false  # ya tiene el nombre correcto → no marcar siempre changed

- name: Asegurar que el nodo pueda resolver su propio nombre en /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present
  become: true

- name: Persist inotify sysctl tuning
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k3s-inotify.conf
    content: |
      fs.inotify.max_user_watches = {{ k3s_sysctl_inotify_max_user_watches }}
      fs.inotify.max_user_instances = {{ k3s_sysctl_inotify_max_user_instances }}
    mode: "0644"
  become: true
  notify: Reload systemd sysctl
  when: "'k3s_nodes' in group_names"

- name: Freeze RK1 kernel and driver packages (never auto-update — breaks custom rockchip kernel)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  become: true
  loop:
    - linux-headers-rockchip
    - linux-image-rockchip
    - linux-modules-6.1.0-1025-rockchip
    - linux-modules-extra-6.1.0-1025-rockchip
    - linux-rockchip
    - libmali-g610-x11
    - mali-g610-firmware
    - rockchip-firmware
    - rockchip-multimedia-config
    - u-boot-turing-rk1
    - ubuntu-rockchip-settings
    - ubuntu-rockchip-settings-server
    - ubuntu-server-rockchip
  when:
    - "'rk1_nodes' in group_names"
  failed_when: false

# ----------------------------------------------------------------------------
# State detection — drives every idempotency guard in the included task files
# ----------------------------------------------------------------------------
- name: Check whether the K3s server service is active
  ansible.builtin.command:
    cmd: systemctl is-active k3s
  register: k3s_server_active
  failed_when: false
  changed_when: false

- name: Check whether the K3s agent service is active
  ansible.builtin.command:
    cmd: systemctl is-active k3s-agent
  register: k3s_agent_active
  failed_when: false
  changed_when: false

- name: Check whether embedded etcd is already initialised (SQLite→etcd migration done)
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/db/etcd/member
  become: true
  register: k3s_etcd_member

- name: Download the K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
    force: false  # idempotent: don't re-download on every run
  become: true

# ----------------------------------------------------------------------------
# Dispatch by node role (mutually exclusive)
# ----------------------------------------------------------------------------
- name: Configure the cluster-init (first control-plane) node
  ansible.builtin.include_tasks: server-init.yml
  when: inventory_hostname == groups['server_nodes'][0]

- name: Configure additional control-plane (join) nodes
  ansible.builtin.include_tasks: server-join.yml
  when: inventory_hostname in (groups['server_join_nodes'] | default([]))

- name: Configure agent (worker) nodes
  ansible.builtin.include_tasks: agent.yml
  when: inventory_hostname in (groups['agent_nodes'] | default([]))

# First control-plane node: bootstrap embedded etcd.
#
# K3s migrates an existing SQLite datastore to embedded etcd automatically the FIRST
# time it (re)starts with `--cluster-init`. The guard `not k3s_etcd_member.stat.exists`
# makes the migrate/install run exactly once; re-runs converge to changed=0.
#
# Safety: the live SQLite db is copied aside first, and K3s leaves the original
# state.db on disk after migrating (etcd becomes the active datastore).

- name: Back up the SQLite datastore before the etcd migration (best-effort, hot copy)
  ansible.builtin.copy:
    src: /var/lib/rancher/k3s/server/db/state.db
    dest: /var/lib/rancher/k3s/server/db/state.db.pre-etcd-migration
    remote_src: true
    mode: "0600"
    force: false  # capture the pre-migration snapshot once, never overwrite
  become: true
  when:
    - k3s_server_active.stdout == 'active'
    - not k3s_etcd_member.stat.exists

- name: Install, migrate, or upgrade the K3s init server (--cluster-init triggers SQLite→etcd migration)
  ansible.builtin.shell: |
    /bin/bash -c 'set -o pipefail; /tmp/k3s-install.sh'
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "{{ k3s_server_exec }} --cluster-init"
    K3S_TOKEN: "{{ k3s_token }}"
    K3S_KUBECONFIG_MODE: "{{ k3s_kubeconfig_mode }}"
  become: true
  when: (not k3s_etcd_member.stat.exists) or (k3s_needs_upgrade | default(false))
  changed_when: (not k3s_etcd_member.stat.exists) or (k3s_needs_upgrade | default(false))

- name: Ensure the K3s server is started and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
  become: true
  changed_when: false

- name: Wait for the K3s API to be ready
  ansible.builtin.command:
    cmd: k3s kubectl get --raw /readyz
  become: true
  register: k3s_api_ready
  until: k3s_api_ready.rc == 0
  retries: 24
  delay: 5
  changed_when: false

- name: Confirm embedded etcd is the active datastore
  ansible.builtin.command:
    cmd: k3s etcd-snapshot list
  become: true
  register: k3s_etcd_check
  changed_when: false
  failed_when: k3s_etcd_check.rc != 0

- name: Ensure the init node carries the worker role label
  ansible.builtin.command:
    cmd: k3s kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/worker=worker --overwrite
  become: true
  changed_when: false

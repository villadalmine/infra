leloir_namespace: leloir
leloir_registry: "registry.registry:5000"
leloir_image_name: "ai/leloir-controlplane"
leloir_image_tag: "latest"
leloir_hostname: "leloir.cluster.home"

# Postgres
leloir_db_name: leloir
leloir_db_user: leloir
leloir_db_password: "{{ lookup('password', role_path + '/defaults/.leloir_db_password length=32 chars=ascii_letters,digits') }}"
leloir_db_storage_class: "local-path"
leloir_db_storage_size: "5Gi"

# HolmesGPT endpoint (in-cluster)
leloir_holmes_api_url: "http://holmesgpt-holmes.ai.svc.cluster.local:80"

# Control plane resources
leloir_cpu_request: "100m"
leloir_memory_request: "128Mi"
leloir_cpu_limit: "1"
leloir_memory_limit: "512Mi"

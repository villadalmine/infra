leloir_namespace: leloir
leloir_registry: "registry.registry:5000"
leloir_image_name: "ai/leloir-controlplane"
leloir_image_tag: "latest"
leloir_hostname: "leloir.cluster.home"

# Postgres
leloir_db_name: leloir
leloir_db_user: leloir
leloir_db_password: "{{ lookup('password', role_path + '/defaults/.leloir_db_password length=32 chars=ascii_letters,digits') }}"
leloir_db_storage_class: "longhorn-nvme"
leloir_db_storage_size: "5Gi"

# HolmesGPT endpoint (in-cluster)
leloir_holmes_api_url: "http://holmesgpt-holmes.ai.svc.cluster.local:80"

# Auth mode: "single-user" (dev) or "oidc" (production with Dex)
leloir_auth_mode: "single-user"

# OIDC config — only used when leloir_auth_mode == "oidc"
# leloir_oidc_client_secret must match dex_leloir_client_secret in install-dex.
# Set in defaults/secrets.yml (gitignored).
leloir_oidc_issuer: "https://dex.cluster.home"
leloir_oidc_client_id: "leloir"
leloir_oidc_client_secret: ""
leloir_oidc_redirect_url: "https://leloir.cluster.home/auth/callback"
# Email del admin (gets "admin" role in Leloir) — set in defaults/secrets.yml
leloir_oidc_admin_email: ""
# OIDC split-horizon (ver docs/OIDC_SETUP.md): el CP valida el issuer HTTPS que usa
# cluster-home-ca (CA privada). El rol copia esa CA al ns leloir como este Secret; el
# chart lo monta (auth.oidc.caSecret) y setea caFile. Vacío = no copiar (issuer público).
leloir_oidc_ca_secret: "leloir-oidc-ca"
leloir_oidc_ca_source_ns: "cert-manager"     # ns donde vive cluster-home-ca
leloir_oidc_ca_source_name: "cluster-home-ca"

# Path al homelab-appset.yaml — ArgoCD gestiona Dex + Leloir via Helm cuando mode=oidc
# Apunta al repo leloir clonado localmente (el mismo que se usa para make leloir-build)
leloir_homelab_appset_path: "/home/dalmine/Nextcloud/Repos/projects/leloir/deploy/homelab-appset.yaml"

# Control plane resources
leloir_cpu_request: "100m"
leloir_memory_request: "128Mi"
leloir_cpu_limit: "1"
leloir_memory_limit: "512Mi"

# ─── MCP Gateway ──────────────────────────────────────────────────────────────
# El broker por-tenant de tools. Misma imagen que el control plane (dos binarios),
# command /leloir-mcp-gateway. Sirve API + /metrics en el mismo puerto 8082.
# Es infra interna (sin HTTPRoute) — lo consumen el control plane y los adapters.
# El puerto (8082) es fijo: coincide con el default del binario y el EXPOSE del
# Dockerfile, no es una perilla versátil.
leloir_gateway_cpu_request: "50m"
leloir_gateway_memory_request: "64Mi"
leloir_gateway_cpu_limit: "500m"
leloir_gateway_memory_limit: "256Mi"
# Servers MCP por-tenant. Vacío por defecto — los servers reales se declaran con
# el CRD MCPServer (nada hardcodeado). Cada entry: {name, tenant, transport,
# endpoint, toolAllowlist:[...]}. El aislamiento por-tenant lo garantiza el gateway.
# La FACHADA MCP (spec-m17, /mcp-facade/{tenant}) ya está en la imagen: cualquier
# agente MCP (Holmes 0.35 mcp_servers, kagent, Claude) consume estos servers
# gobernado sin SDK. E2E validado 08/07 con un tool server http de prueba.
# NOTA: transport:mcp↔kagent-tools tiene un issue de compat SSE (handshake lento) —
# pendiente; transport:http anda. Registrar servers reales acá o vía CRD MCPServer.
# Servers registrados en el gateway. `demo` = tool juguete (insignia e2e);
# `kubernetes` = tool server REAL read-only (get_pods/logs/events) para que el
# flagship investigue incidentes GROUNDED, gobernado + auditado. El deployment
# del k8s tool server está en leloir/deploy/demo/k8s-tools.yaml (aplicar aparte).
leloir_gateway_servers:
  - name: demo
    tenant: default
    transport: http
    endpoint: http://leloir-demo-tool.leloir.svc.cluster.local:8080
    toolAllowlist: [cluster_node_count]
  - name: kubernetes
    tenant: default
    transport: http
    endpoint: http://leloir-k8s-tools.leloir.svc.cluster.local:8080
    toolAllowlist: [get_pods, get_pod_logs, get_pod_events]
  - name: kubernetes-shadow
    tenant: default
    transport: http
    endpoint: http://leloir-k8s-tools.leloir.svc.cluster.local:8080
    shadow: true
    toolAllowlist: [restart_deployment, delete_pod, get_pods]
  # Servers per-tenant del living-demo (deploy/demo/modes). `allowedNamespaces`
  # acota las tool calls al namespace del tenant: el gateway RECHAZA
  # (namespace_not_allowed) si un agente pide otro ns — anti-leak cross-tenant.
  # El `kubernetes` default queda SIN restricción (el flagship investiga cualquier ns).
  - name: kubernetes
    tenant: demo-mode1
    transport: http
    endpoint: http://leloir-k8s-tools.leloir.svc.cluster.local:8080
    toolAllowlist: [get_pods, get_pod_logs, get_pod_events]
    allowedNamespaces: [demo-mode1]
  - name: kubernetes
    tenant: demo-mode2
    transport: http
    endpoint: http://leloir-k8s-tools.leloir.svc.cluster.local:8080
    toolAllowlist: [get_pods, get_pod_logs, get_pod_events]
    allowedNamespaces: [demo-mode2]
  - name: kubernetes
    tenant: demo-mode3
    transport: http
    endpoint: http://leloir-k8s-tools.leloir.svc.cluster.local:8080
    toolAllowlist: [get_pods, get_pod_logs, get_pod_events]
    allowedNamespaces: [demo-mode3]
  - name: kubernetes
    tenant: demo-mode4
    transport: http
    endpoint: http://leloir-k8s-tools.leloir.svc.cluster.local:8080
    toolAllowlist: [get_pods, get_pod_logs, get_pod_events]
    allowedNamespaces: [demo-mode4]
  # Memoria por-tenant (spec-m18): leloir-memory-mcp por tenant. El gateway
  # escribe X-Leloir-Tenant → cada tenant ve SÓLO su memoria. NOTA: hoy el
  # gateway lee sus servers de esta config estática (no de los MCPServer CRD);
  # por eso los tenants con memoria se listan acá.
  - name: memory
    tenant: demo-mode1
    transport: mcp
    endpoint: http://leloir-memory-mcp.leloir.svc.cluster.local:8090/mcp
    toolAllowlist: [remember, recall, forget]
  - name: memory
    tenant: demo-mode2
    transport: mcp
    endpoint: http://leloir-memory-mcp.leloir.svc.cluster.local:8090/mcp
    toolAllowlist: [remember, recall, forget]
  # Honcho (memoria episódica para el black-box de mode2, vía la fachada MCP).
  # Codificado 16/07 (estaba vivo pero no en el rol → make leloir lo revertía).
  - name: honcho
    tenant: demo-mode2
    transport: mcp
    endpoint: http://leloir-honcho-mcp.honcho.svc.cluster.local:8090/
    toolAllowlist: [recall_incident, capture_incident]

# Observabilidad (ServiceMonitor + dashboards Grafana)
leloir_monitoring_namespace: monitoring
leloir_git_raw: "https://raw.githubusercontent.com/villadalmine/leloir/main"

# LLM broker (spec-m15/m16): instancia litellm gestionada por el operator
leloir_litellm_namespace: ai
leloir_litellm_instance: leloir-llm
# Backend LLM propio de Leloir (LiteLLMInstance + LiteLLMModel del litellm-operator).
# Nada versátil hardcodeado: el modelo upstream, la key y el tag son variables.
# Decisión 15/07: TODO el stack corre en claude-sonnet-5 (no free/gemini).
leloir_litellm_image_repo: ghcr.io/berriai/litellm-database
leloir_litellm_image_tag: v1.91.0
leloir_llm_upstream_model: "openrouter/anthropic/claude-sonnet-5"
# Key OpenRouter DEDICADA de Leloir en el secret litellm-secrets (atribución propia,
# NO la compartida "openclaw"). Ver leloir_openrouter_api_key en el vault.
leloir_llm_openrouter_key_name: LELOIR_OPENROUTER_API_KEY
# modelName del LiteLLMModel primario = el modelo REAL (honestidad del audit: 16/07 se
# renombró el legacy engañoso "rk1-npu-local" → "claude-sonnet-5"; el audit muestra este nombre).
leloir_llm_model_alias: claude-sonnet-5
leloir_llm_request_timeout: 600      # Sonnet-5 tiene más latencia que gemini-flash
leloir_llm_redis_host: redis.redis-system.svc.cluster.local

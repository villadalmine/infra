# Deploy Leloir control plane — Postgres StatefulSet + leloir-controlplane Deployment.
# Pattern: ClusterIP + HTTPRoute → cluster-gateway (no LoadBalancer, no Ingress).
# Storage: local-path PVC for Postgres (NAS-free, single-node).

- name: Create leloir namespace
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ leloir_namespace }}"
    state: present

# ─── Postgres ─────────────────────────────────────────────────────────────────

- name: Create Postgres credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-leloir-credentials
        namespace: "{{ leloir_namespace }}"
      type: Opaque
      stringData:
        POSTGRES_DB: "{{ leloir_db_name }}"
        POSTGRES_USER: "{{ leloir_db_user }}"
        POSTGRES_PASSWORD: "{{ leloir_db_password }}"
        DSN: "postgres://{{ leloir_db_user }}:{{ leloir_db_password }}@postgres-leloir.{{ leloir_namespace }}.svc.cluster.local:5432/{{ leloir_db_name }}?sslmode=disable"

- name: Create Postgres PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-leloir-data
        namespace: "{{ leloir_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ leloir_db_storage_class }}"
        resources:
          requests:
            storage: "{{ leloir_db_storage_size }}"

- name: Deploy Postgres StatefulSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres-leloir
        namespace: "{{ leloir_namespace }}"
        labels:
          app: postgres-leloir
      spec:
        serviceName: postgres-leloir
        replicas: 1
        selector:
          matchLabels:
            app: postgres-leloir
        template:
          metadata:
            labels:
              app: postgres-leloir
          spec:
            tolerations:
              - operator: Exists
            containers:
              - name: postgres
                image: postgres:16-alpine
                ports:
                  - containerPort: 5432
                envFrom:
                  - secretRef:
                      name: postgres-leloir-credentials
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/postgresql/data
                    subPath: pgdata
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "{{ leloir_db_user }}", "-d", "{{ leloir_db_name }}"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: postgres-leloir-data

- name: Create Postgres Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-leloir
        namespace: "{{ leloir_namespace }}"
      spec:
        type: ClusterIP
        selector:
          app: postgres-leloir
        ports:
          - port: 5432
            targetPort: 5432

- name: Wait for Postgres to be ready
  ansible.builtin.command:
    cmd: kubectl rollout status statefulset/postgres-leloir -n {{ leloir_namespace }} --timeout=120s
  register: pg_rollout
  until: pg_rollout.rc == 0
  retries: 6
  delay: 10
  changed_when: false

# ─── Control plane config ─────────────────────────────────────────────────────

- name: Create leloir-controlplane ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: leloir-config
        namespace: "{{ leloir_namespace }}"
      data:
        config.yaml: |
          profile: local

          api:
            httpAddr: ":8080"

          database:
            driver: postgres
            # DSN injected via SECRET_DSN env var at runtime

          auth:
            mode: single-user
            singleUser:
              username: admin

          audit:
            hotRetentionDays: 7

          agents:
            - name: holmesgpt
              type: holmesgpt
              tenantID: default
              custom:
                holmes:
                  apiBaseURL: "{{ leloir_holmes_api_url }}"

          routes:
            - name: catch-all
              tenantID: default
              agentName: holmesgpt
              enabled: true
              priority: 1
              timeoutMinutes: 10

# ─── Control plane deployment ─────────────────────────────────────────────────

- name: Deploy leloir-controlplane
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: leloir-controlplane
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-controlplane
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: leloir-controlplane
        template:
          metadata:
            labels:
              app: leloir-controlplane
          spec:
            tolerations:
              - operator: Exists
            containers:
              - name: controlplane
                image: "{{ leloir_registry }}/{{ leloir_image_name }}:{{ leloir_image_tag }}"
                args:
                  - "--config=/etc/leloir/config.yaml"
                ports:
                  - containerPort: 8080
                    name: http
                env:
                  - name: SECRET_DSN
                    valueFrom:
                      secretKeyRef:
                        name: postgres-leloir-credentials
                        key: DSN
                  - name: LELOIR_DATABASE_DSN
                    valueFrom:
                      secretKeyRef:
                        name: postgres-leloir-credentials
                        key: DSN
                volumeMounts:
                  - name: config
                    mountPath: /etc/leloir
                    readOnly: true
                resources:
                  requests:
                    cpu: "{{ leloir_cpu_request }}"
                    memory: "{{ leloir_memory_request }}"
                  limits:
                    cpu: "{{ leloir_cpu_limit }}"
                    memory: "{{ leloir_memory_limit }}"
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
            volumes:
              - name: config
                configMap:
                  name: leloir-config

- name: Create leloir-controlplane Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: leloir-controlplane
        namespace: "{{ leloir_namespace }}"
      spec:
        type: ClusterIP
        selector:
          app: leloir-controlplane
        ports:
          - name: http
            port: 80
            targetPort: 8080

- name: Create HTTPRoute for leloir UI + API
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: leloir
        namespace: "{{ leloir_namespace }}"
      spec:
        parentRefs:
          - name: cluster-gateway
            namespace: gateway
        hostnames:
          - "{{ leloir_hostname }}"
        rules:
          - backendRefs:
              - name: leloir-controlplane
                port: 80

- name: Wait for leloir-controlplane rollout
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/leloir-controlplane -n {{ leloir_namespace }} --timeout=120s
  register: leloir_rollout
  until: leloir_rollout.rc == 0
  retries: 6
  delay: 10
  changed_when: false

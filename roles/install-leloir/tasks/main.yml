# Deploy Leloir control plane — Postgres StatefulSet + leloir-controlplane Deployment.
# Pattern: ClusterIP + HTTPRoute → cluster-gateway (no LoadBalancer, no Ingress).
# Storage: local-path PVC for Postgres (NAS-free, single-node).

# ─── CRDs (bootstrap) ─────────────────────────────────────────────────────────
# Applied once so the cluster can accept Leloir resources before ArgoCD syncs.
# After this, the ArgoCD Application below takes over ongoing management.

- name: Apply Leloir CRDs (bootstrap)
  ansible.builtin.command:
    cmd: kubectl apply -k {{ role_path }}/files/crds/
  register: crd_apply
  changed_when: "'created' in crd_apply.stdout or 'configured' in crd_apply.stdout"

# ─── GitOps — ArgoCD Application ──────────────────────────────────────────────

- name: Apply Leloir CRDs ArgoCD Application
  kubernetes.core.k8s:
    state: present
    src: "{{ role_path }}/files/argocd/leloir-crds-app.yaml"

- name: Create leloir namespace
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ leloir_namespace }}"
    state: present

# ─── Postgres ─────────────────────────────────────────────────────────────────

- name: Create Postgres credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-leloir-credentials
        namespace: "{{ leloir_namespace }}"
      type: Opaque
      stringData:
        POSTGRES_DB: "{{ leloir_db_name }}"
        POSTGRES_USER: "{{ leloir_db_user }}"
        POSTGRES_PASSWORD: "{{ leloir_db_password }}"
        DSN: "postgres://{{ leloir_db_user }}:{{ leloir_db_password }}@postgres-leloir.{{ leloir_namespace }}.svc.cluster.local:5432/{{ leloir_db_name }}?sslmode=disable"

- name: Create Postgres PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-leloir-data
        namespace: "{{ leloir_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ leloir_db_storage_class }}"
        resources:
          requests:
            storage: "{{ leloir_db_storage_size }}"

- name: Deploy Postgres StatefulSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postgres-leloir
        namespace: "{{ leloir_namespace }}"
        labels:
          app: postgres-leloir
      spec:
        serviceName: postgres-leloir
        replicas: 1
        selector:
          matchLabels:
            app: postgres-leloir
        template:
          metadata:
            labels:
              app: postgres-leloir
          spec:
            # Pin al pool rk1-longhorn: el PVC Longhorn sólo attachea en esos
            # nodos (sin esto, un rollout puede schedular en super6c y el volumen
            # no attachea — Multi-Attach error).
            nodeSelector:
              storage: rk1-longhorn
            tolerations:
              - operator: Exists
            containers:
              - name: postgres
                image: pgvector/pgvector:pg16   # postgres 16 + extensión vector (spec-m22 RAG)
                ports:
                  - containerPort: 5432
                envFrom:
                  - secretRef:
                      name: postgres-leloir-credentials
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/postgresql/data
                    subPath: pgdata
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "{{ leloir_db_user }}", "-d", "{{ leloir_db_name }}"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: postgres-leloir-data

- name: Create Postgres Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-leloir
        namespace: "{{ leloir_namespace }}"
      spec:
        type: ClusterIP
        selector:
          app: postgres-leloir
        ports:
          - port: 5432
            targetPort: 5432

- name: Wait for Postgres to be ready
  ansible.builtin.command:
    cmd: kubectl rollout status statefulset/postgres-leloir -n {{ leloir_namespace }} --timeout=120s
  register: pg_rollout
  until: pg_rollout.rc == 0
  retries: 6
  delay: 10
  changed_when: false

# ─── OIDC secret (solo cuando auth.mode == "oidc") ────────────────────────────
# Debe contener el mismo valor que dex-leloir-client.client-secret en namespace dex.
# Generar con: openssl rand -base64 32

- name: Create leloir-oidc-secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: leloir-oidc-secret
        namespace: "{{ leloir_namespace }}"
      type: Opaque
      stringData:
        client-secret: "{{ leloir_oidc_client_secret }}"
  when: leloir_auth_mode == "oidc"

# ─── Control plane config + deployment ───────────────────────────────────────
# En modo "oidc" estas tres resources (ConfigMap, Deployment, Service, HTTPRoute)
# pasan a ser gestionadas por ArgoCD via deploy/homelab/leloir/ Helm chart.
# Ansible las crea solo en modo "single-user".

- name: Create leloir-controlplane ConfigMap
  when: leloir_auth_mode != "oidc"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: leloir-config
        namespace: "{{ leloir_namespace }}"
      data:
        config.yaml: |
          profile: local

          api:
            httpAddr: ":8080"
            # Listener interno (spec-m21 21.6): /internal/* (callback de anomalía)
            # en un puerto aparte, NO expuesto por el HTTPRoute → sólo in-cluster,
            # cerrado por CNP al gateway. Elimina la superficie externa.
            internalAddr: ":8090"

          database:
            driver: postgres
            # DSN injected via LELOIR_DATABASE_DSN env var at runtime

          auth:
            mode: {{ leloir_auth_mode }}
          {% if leloir_auth_mode == "oidc" %}
            oidc:
              issuer:      "{{ leloir_oidc_issuer }}"
              clientId:    "{{ leloir_oidc_client_id }}"
              redirectURL: "{{ leloir_oidc_redirect_url }}"
              scopes:
                - openid
                - email
                - profile
                - groups
              adminEmails:
                - "{{ leloir_oidc_admin_email }}"
          {% else %}
            singleUser:
              username: admin
          {% endif %}

          audit:
            hotRetentionDays: 7

          observability:
            metrics:
              enabled: true

          kubernetes:
            enabled: true          # CRD watcher: routes/budgets/agents/investigations

          # Modo 2 containment (spec-m13.4): wirea el containment.Applier. Sin esto
          # (enabled:false) un agente platform-provisioned tendría el scorecard
          # "contained" PERO la contención no se aplicaría (SA/RBAC/egress-lock).
          containment:
            enabled: true
            gatewayHost: leloir-mcp-gateway.leloir.svc.cluster.local
            gatewayPort: 8082
            llmHost: "{{ leloir_litellm_instance }}.{{ leloir_litellm_namespace }}.svc.cluster.local"
            llmPort: 4000
            platformNamespaces: [leloir, "{{ leloir_litellm_namespace }}"]

          llmBroker:
            # envoy-ai-gw = COMPUESTO (spec-m15 15.6): Envoy delante (routing keyless
            # por x-leloir-tenant + token-ratelimit por tenant), litellm detrás
            # (budget USD + spend = fuente de verdad). ⚠️ gap conocido: el header es
            # spoofeable por pods que alcancen el VIP — ver spec-m15 §gap de seguridad
            # (los contenidos NO lo alcanzan: egress-lock; y siguen en own-key).
            driver: envoy-ai-gw
            spendPollInterval: 30s
            litellmOperator:
              namespace: "{{ leloir_litellm_namespace }}"
              instanceName: "{{ leloir_litellm_instance }}"
              endpoint: "http://{{ leloir_litellm_instance }}.{{ leloir_litellm_namespace }}.svc.cluster.local:4000"
              models: [rk1-npu-local]
            envoyAIGateway:
              namespace: "{{ leloir_litellm_namespace }}"
              gatewayName: "leloir-ai-gw"
              endpoint: "http://envoy-ai-leloir-ai-gw-47211a0b.envoy-gateway-system.svc.cluster.local:80"
              upstreamHost: "{{ leloir_litellm_instance }}.{{ leloir_litellm_namespace }}.svc.cluster.local"
              upstreamPort: 4000
              tokensPerHour: 200000
              # spec-m19 19.4: el frente keyless EXIGE un JWT firmado por Leloir
              # (el tenant sale del claim verificado, no del header — anti-spoofing).
              requireJWT: true

          # Lazo anomalía → quarantine (spec-m21): si el spend de un tenant
          # salta > este umbral entre dos polls, se AÍSLA (freeze budget +
          # rechazo de alertas + evento CRÍTICO). 0 = off. Gobierno proactivo.
          anomaly:
            spendVelocityUSD: 0.50
            # Auto-release por cooldown (spec-m21 21.6): un tenant aislado más de
            # estos minutos se libera solo (el detector re-aísla si sigue mal).
            # Acota un falso positivo. 2 min = demoable; en prod real subiría.
            autoReleaseCooldownMinutes: 2
            # thrashToken se inyecta por LELOIR_THRASH_TOKEN (env desde Secret) —
            # autentica el callback de escalada de thrash del gateway.

          # Memoria episódica RAG (spec-m22): al llegar una alerta se busca por
          # similitud coseno (pgvector, MISMA Postgres) un incidente pasado del
          # MISMO tenant; si la distancia < umbral se inyecta su resolución como
          # SkillRef efímero (auto-runbook). embeddingModel: "local" = embedder
          # en-proceso (cero deps, sin key de provider); poné el alias de un
          # modelo de embedding de la capa LLM para vectorizar hosted (metrado).
          rag:
            embeddingModel: "local"
            embeddingDim: 256
            distanceThreshold: 0.25
            # TTL/pruning (spec-m22 22.6): poda incidentes más viejos que N días
            # (barrido cada 6h). Acota el crecimiento. 0 = retener por siempre.
            retentionDays: 90

          # In-process adapters (the flagship) route tool calls here → governed
          # path (allowlist/creds/audit). Without this the flagship declaring
          # harness.tools would DRIFT (declared gateway but never reaches it).
          mcpGateway:
            endpoint: "http://leloir-mcp-gateway.leloir.svc.cluster.local:8082"

          modelProvider:
            models:
              - id: demo-model
                upstream: rk1-npu-local
                pricing: {inputPer1M: 0.15, outputPer1M: 0.60}
                maxTokensPerCall: 400
            routing: {default: demo-model}

          tenantBudgets:
            - tenantID: default
              monthlyMaxUSD: 1
              hardLimitAction: reject

          agents:
            - name: leloir-agent
              type: leloir-agent
              tenantID: default
              harness:
                systemPrompt: |
                  You are the Leloir first-party incident responder. Diagnose the alert
                  against the REAL cluster using your tools, in this order:
                  1. Call get_pods with the namespace from the alert to find the failing
                     pod and its exact name.
                  2. Call get_pod_logs with that exact pod name AND namespace — the real
                     error is in the logs; you MUST read them before concluding.
                  3. Call get_pod_events for the pod if needed.
                  Then give a concise root cause that QUOTES the actual error from the
                  logs, and a concrete fix. Do not repeat get_pods; move on to the logs.
                loop: {maxIterations: 6}
                model: demo-model
                credentials: {from: llmBroker}
                # Dogfooding: the flagship routes its tools through OUR gateway (facade)
                # → its scorecard is 5/5, NOT off-radar (D9). The tool SCHEMA must be
                # declared in custom.tools.definitions; harness.tools only ALLOWLISTS.
                # `kubernetes` = real read-only k8s tools → GROUNDED investigation.
                tools:
                  - server: demo
                    allow: [cluster_node_count]
                  - server: kubernetes
                    allow: [get_pods, get_pod_logs, get_pod_events]
              custom:
                tools:
                  definitions:
                    - name: cluster_node_count
                      mcpServer: demo
                      description: "Return the number of nodes in the Kubernetes cluster"
                      parameters: {type: object, properties: {}}
                    - name: get_pods
                      mcpServer: kubernetes
                      description: "List pods with status and restart count in a namespace"
                      parameters: {type: object, properties: {namespace: {type: string, description: "kubernetes namespace"}}}
                    - name: get_pod_logs
                      mcpServer: kubernetes
                      description: "Recent logs of a pod to find the error"
                      parameters: {type: object, properties: {namespace: {type: string}, name: {type: string, description: "pod name"}}, required: [name]}
                    - name: get_pod_events
                      mcpServer: kubernetes
                      description: "Kubernetes events for a pod (why it is failing)"
                      parameters: {type: object, properties: {namespace: {type: string}, name: {type: string, description: "pod name"}}, required: [name]}
            - name: holmesgpt
              type: holmesgpt
              tenantID: default
              custom:
                holmes:
                  apiBaseURL: "{{ leloir_holmes_api_url }}"

          routes:
            - name: catch-all
              tenantID: default
              agentName: holmesgpt
              enabled: true
              priority: 1
              timeoutMinutes: 10

# ─── ServiceAccount + RBAC del control plane (m15/m16) ───────────────────────
# El watcher necesita leloir.dev cluster-wide + Deployments (source rollout);
# el LLM broker emite CRs litellm.palena.ai y lee la key del flagship (Secret)
# SOLO en el namespace de la instancia litellm (ai) — scoped, no cluster-wide.

- name: Create leloir-controlplane ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: leloir-controlplane
        namespace: "{{ leloir_namespace }}"

- name: Create leloir-controlplane ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: leloir-controlplane
      rules:
        - apiGroups: ["leloir.dev"]
          # skillsources: la resolución de skills (route.skills → SkillRef con
          # contenido) los lee del namespace de la ruta al lanzar la investigación.
          resources: ["tenants", "alertroutes", "agentregistrations", "tenantbudgets", "mcpservers", "investigations", "scheduledinvestigations", "skillsources"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["leloir.dev"]
          # El reconciler escribe health/conditions de vuelta al .status de cada CRD
          # (agentregistrations/status faltaba → health no persistía).
          resources: ["investigations/status", "scheduledinvestigations/status", "agentregistrations/status", "tenants/status", "alertroutes/status", "mcpservers/status", "tenantbudgets/status"]
          verbs: ["get", "update", "patch"]
        # Modo 2 containment (spec-m13.4): el containment.Applier genera SA + RBAC
        # NAMESPACED (RoleBinding, no ClusterRoleBinding) + egress-lock + patchea el
        # Deployment del agente contenido. NO crea ClusterRoles (el compartido
        # leloir-contained-readonly se pre-crea en tenant-isolation-policy.yaml).
        - apiGroups: [""]
          resources: ["serviceaccounts"]
          verbs: ["get", "list", "create", "patch", "update"]
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources: ["roles", "rolebindings"]
          verbs: ["get", "list", "create", "patch", "update"]
        # bind: atar el ClusterRole predefinido leloir-contained-readonly vía RoleBinding
        # SIN poseer sus permisos (escalation-safe, scoped a ese ClusterRole).
        - apiGroups: ["rbac.authorization.k8s.io"]
          resources: ["clusterroles"]
          verbs: ["bind"]
          resourceNames: ["leloir-contained-readonly"]
        - apiGroups: ["cilium.io"]
          resources: ["ciliumnetworkpolicies"]
          verbs: ["get", "list", "create", "patch", "update"]
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get", "list", "watch", "patch"]
        # Own-key provisioning (spec-m13.4, llmKeyFrom: llmBroker): el Applier
        # SINCRONIZA la virtual key del tenant (ns del broker → ns del agente
        # contenido) por server-side apply. Sólo ESCRITURA de la copia — la
        # lectura del origen usa el Role namespaced leloir-broker en el ns del
        # broker; sin get/list de secrets cluster-wide a propósito.
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["create", "patch"]
        # Skills type configmap: el resolver lee el ConfigMap que referencia un
        # SkillSource (siempre del MISMO ns de la ruta). Sólo get, sin list/watch.
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["get"]
        # RBAC posture (13.16, D11): sondear la SA efectiva de cada agente con
        # SubjectAccessReviews (visibilidad, no enforcement; drift-detection en
        # agentes contenidos).
        - apiGroups: ["authorization.k8s.io"]
          resources: ["subjectaccessreviews"]
          verbs: ["create"]

- name: Bind leloir-controlplane ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: leloir-controlplane
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: leloir-controlplane
      subjects:
        - kind: ServiceAccount
          name: leloir-controlplane
          namespace: "{{ leloir_namespace }}"

- name: Create leloir-broker Role in litellm namespace (scoped)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: leloir-llm-broker
        namespace: "{{ leloir_litellm_namespace }}"
      rules:
        - apiGroups: ["litellm.palena.ai"]
          resources: ["litellmteams", "litellmvirtualkeys"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        # get: leer las virtual keys; create/update/delete: el driver envoy-ai-gw
        # DERIVA un secret por tenant (api_key → apiKey para el BSP) en este ns.
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "create", "update", "delete"]
        # Driver envoy-ai-gw (spec-m15 15.6): el frente por tenant, en este ns.
        - apiGroups: ["aigateway.envoyproxy.io"]
          resources: ["aigatewayroutes", "aiservicebackends", "backendsecuritypolicies"]
          verbs: ["get", "list", "create", "update", "delete"]
        - apiGroups: ["gateway.envoyproxy.io"]
          resources: ["backends", "backendtrafficpolicies", "securitypolicies"]
          verbs: ["get", "list", "create", "update", "delete"]
        # JWT keyless front (spec-m19): el driver persiste la signing key (Secret,
        # ya cubierto arriba) y publica el JWKS a un ConfigMap en este ns.
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["get", "list", "create", "update"]

- name: Bind leloir-broker Role
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: leloir-llm-broker
        namespace: "{{ leloir_litellm_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: leloir-llm-broker
      subjects:
        - kind: ServiceAccount
          name: leloir-controlplane
          namespace: "{{ leloir_namespace }}"

- name: Read litellm master key secret (from litellm namespace)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: leloir-llm-master-key
    namespace: "{{ leloir_litellm_namespace }}"
  register: litellm_master_secret
  no_log: true

- name: Copy litellm master key into leloir namespace (env secretKeyRef must be same-ns)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-master-key
        namespace: "{{ leloir_namespace }}"
      type: Opaque
      data:
        master-key: "{{ litellm_master_secret.resources[0].data['master-key'] }}"
  when: litellm_master_secret.resources | length > 0
  no_log: true

# ─── Thrash-escalation shared token (spec-m21 21.6) ──────────────────────────
# Autentica el callback del gateway → control plane (POST /internal/anomaly).
# Se genera UNA vez y se reusa (estable entre deploys) — mismo secreto en los
# dos binarios. Sin él, el endpoint queda deshabilitado (fail-closed).

- name: Read existing thrash-escalation token (generate once, reuse)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: leloir-thrash-token
    namespace: "{{ leloir_namespace }}"
  register: leloir_thrash_secret
  no_log: true

- name: Compute thrash token (reuse existing or generate 40 chars)
  ansible.builtin.set_fact:
    leloir_thrash_token: "{{ (leloir_thrash_secret.resources[0].data.token | b64decode) if (leloir_thrash_secret.resources | length > 0) else lookup('password', '/dev/null length=40 chars=ascii_letters,digits') }}"
  no_log: true

- name: Create thrash-escalation token Secret (shared gateway↔control plane)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: leloir-thrash-token
        namespace: "{{ leloir_namespace }}"
      type: Opaque
      stringData:
        token: "{{ leloir_thrash_token }}"
  no_log: true


# ─── Control plane deployment ─────────────────────────────────────────────────

- name: Deploy leloir-controlplane
  when: leloir_auth_mode != "oidc"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: leloir-controlplane
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-controlplane
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: leloir-controlplane
        template:
          metadata:
            labels:
              app: leloir-controlplane
          spec:
            serviceAccountName: leloir-controlplane
            nodeSelector:
              kubernetes.io/arch: arm64
              # rk1 pool resuelve el registry in-cluster (registry.registry:5000);
              # otros nodos ARM64 (super6c) no → ImagePullBackOff. Ver STATUS.
              storage: rk1-longhorn
            tolerations:
              - operator: Exists
            containers:
              - name: controlplane
                image: "{{ leloir_registry }}/{{ leloir_image_name }}:{{ leloir_image_tag }}"
                args:
                  - "--config=/etc/leloir/config.yaml"
                ports:
                  - containerPort: 8080
                    name: http
                  - containerPort: 8090
                    name: internal   # /internal/* — NO en el HTTPRoute (spec-m21 21.6)
                env:
                  - name: LELOIR_DATABASE_DSN
                    valueFrom:
                      secretKeyRef:
                        name: postgres-leloir-credentials
                        key: DSN
                  - name: LELOIR_LITELLM_MASTER_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-master-key
                        key: master-key
                  - name: LELOIR_THRASH_TOKEN   # gate de POST /internal/anomaly (spec-m21 21.6)
                    valueFrom:
                      secretKeyRef:
                        name: leloir-thrash-token
                        key: token
                volumeMounts:
                  - name: config
                    mountPath: /etc/leloir
                    readOnly: true
                resources:
                  requests:
                    cpu: "{{ leloir_cpu_request }}"
                    memory: "{{ leloir_memory_request }}"
                  limits:
                    cpu: "{{ leloir_cpu_limit }}"
                    memory: "{{ leloir_memory_limit }}"
                readinessProbe:
                  httpGet:
                    path: /readyz
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 30
            volumes:
              - name: config
                configMap:
                  name: leloir-config

- name: Create leloir-controlplane Service
  when: leloir_auth_mode != "oidc"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: leloir-controlplane
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-controlplane   # el ServiceMonitor selecciona por esta label
      spec:
        type: ClusterIP
        selector:
          app: leloir-controlplane
        ports:
          - name: http
            port: 80
            targetPort: 8080

# Service SEPARADA para el listener interno (spec-m21 21.6): expone :8090 sólo
# in-cluster (NO tiene HTTPRoute) → el callback de anomalía no es alcanzable desde
# afuera. La CNP de abajo la cierra al gateway.
- name: Create leloir-controlplane-internal Service (/internal/*, in-cluster only)
  when: leloir_auth_mode != "oidc"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: leloir-controlplane-internal
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-controlplane
      spec:
        type: ClusterIP
        selector:
          app: leloir-controlplane
        ports:
          - name: internal
            port: 8090
            targetPort: 8090

# CNP: sólo el gateway alcanza el puerto interno :8090 del control plane
# (defense-in-depth SOBRE el bearer token). enableDefaultDeny.ingress: false para
# NO tocar el puerto público :8080 — sólo restringimos el 8090.
- name: Lock the internal anomaly port to the gateway (CiliumNetworkPolicy)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: leloir-controlplane-internal-lock
        namespace: "{{ leloir_namespace }}"
      spec:
        endpointSelector:
          matchLabels:
            app: leloir-controlplane
        # NO default-deny: no queremos cerrar el :8080 público sin querer.
        enableDefaultDeny:
          ingress: false
          egress: false
        ingressDeny:
          # Denegar :8090 a TODO lo que NO sea el gateway.
          - fromEndpoints:
              - matchExpressions:
                  - key: app
                    operator: NotIn
                    values: ["leloir-mcp-gateway"]
            toPorts:
              - ports:
                  - port: "8090"
                    protocol: TCP

- name: Create HTTPRoute for leloir UI + API
  when: leloir_auth_mode != "oidc"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: leloir
        namespace: "{{ leloir_namespace }}"
      spec:
        parentRefs:
          - name: cluster-gateway
            namespace: gateway
        hostnames:
          - "{{ leloir_hostname }}"
        rules:
          - backendRefs:
              - name: leloir-controlplane
                port: 80

- name: Wait for leloir-controlplane rollout (single-user mode)
  when: leloir_auth_mode != "oidc"
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/leloir-controlplane -n {{ leloir_namespace }} --timeout=120s
  register: leloir_rollout
  until: leloir_rollout.rc == 0
  retries: 6
  delay: 10
  changed_when: false

# ─── MCP Gateway ──────────────────────────────────────────────────────────────
# El broker por-tenant de tools. Misma imagen que el control plane (dos binarios),
# command /leloir-mcp-gateway. Infra interna (sin HTTPRoute): lo consumen el
# control plane y los adapters. Sirve API + /metrics en el mismo puerto.
# Se gestiona por Ansible en todos los modos (no depende del auth mode).

- name: Create leloir MCP Gateway ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: leloir-gateway-config
        namespace: "{{ leloir_namespace }}"
      data:
        gateway.yaml: |
          listenAddr: ":8082"
          egressPolicy: allowlist
          rateLimit: {enabled: false}
          observability: {metrics: {enabled: true}}
          # controlPlaneUrl: el gateway resuelve MCPServer CRDs Y reporta la
          # escalada de thrash a POST /internal/anomaly (spec-m21 21.6).
          controlPlaneUrl: "http://leloir-controlplane.{{ leloir_namespace }}.svc.cluster.local"
          # Anti-thrashing (spec-m17.5) + escalada→quarantine (spec-m21 21.6):
          # un tenant que MARTILLA tools denegadas (tripsToQuarantine trips en
          # windowSeconds) se reporta al control plane → quarantine. El token del
          # callback se inyecta por LELOIR_THRASH_TOKEN (env desde Secret).
          antiThrashing:
            enabled: true
            maxConsecutiveErrors: 5
            tripsToQuarantine: 5
            windowSeconds: 300
            # El callback va al puerto INTERNO del control plane (Service interna,
            # no expuesta por el HTTPRoute) — spec-m21 21.6 hardening.
            anomalyEndpoint: "http://leloir-controlplane-internal.{{ leloir_namespace }}.svc.cluster.local:8090/internal/anomaly"
          servers: {{ leloir_gateway_servers | to_json }}

- name: Deploy leloir-mcp-gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: leloir-mcp-gateway
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-mcp-gateway
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: leloir-mcp-gateway
        template:
          metadata:
            labels:
              app: leloir-mcp-gateway
          spec:
            nodeSelector:
              kubernetes.io/arch: arm64
              # mismo pool que el control plane: los rk1 resuelven el registry
              # in-cluster (registry.registry:5000); otros ARM64 no.
              storage: rk1-longhorn
            tolerations:
              - operator: Exists
            containers:
              - name: gateway
                image: "{{ leloir_registry }}/{{ leloir_image_name }}:{{ leloir_image_tag }}"
                imagePullPolicy: Always
                command: ["/leloir-mcp-gateway"]
                args:
                  - "--config=/etc/leloir/gateway.yaml"
                env:
                  - name: LELOIR_THRASH_TOKEN   # mismo secreto que el CP (spec-m21 21.6)
                    valueFrom:
                      secretKeyRef:
                        name: leloir-thrash-token
                        key: token
                ports:
                  - containerPort: 8082
                    name: http
                volumeMounts:
                  - name: cfg
                    mountPath: /etc/leloir
                    readOnly: true
                resources:
                  requests:
                    cpu: "{{ leloir_gateway_cpu_request }}"
                    memory: "{{ leloir_gateway_memory_request }}"
                  limits:
                    cpu: "{{ leloir_gateway_cpu_limit }}"
                    memory: "{{ leloir_gateway_memory_limit }}"
                readinessProbe:
                  httpGet:
                    path: /metrics
                    port: 8082
                  initialDelaySeconds: 5
                  periodSeconds: 10
            volumes:
              - name: cfg
                configMap:
                  name: leloir-gateway-config

- name: Create leloir-mcp-gateway Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: leloir-mcp-gateway
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-mcp-gateway   # el ServiceMonitor selecciona por esta label
      spec:
        type: ClusterIP
        selector:
          app: leloir-mcp-gateway
        ports:
          - name: http
            port: 8082
            targetPort: 8082

# ─── leloir-memory-mcp (spec-m18): memoria por-tenant como MCP server ─────────
# Misma imagen (command /leloir-memory-mcp), respaldado por el Postgres de
# Leloir (tabla propia). El tenant llega en X-Leloir-Tenant escrito por el
# GATEWAY; la CNP de abajo garantiza que sólo el gateway lo alcanza.

- name: Deploy leloir-memory-mcp
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: leloir-memory-mcp
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-memory-mcp
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: leloir-memory-mcp
        template:
          metadata:
            labels:
              app: leloir-memory-mcp
          spec:
            nodeSelector:
              kubernetes.io/arch: arm64
              storage: rk1-longhorn
            tolerations:
              - operator: Exists
            containers:
              - name: memory
                image: "{{ leloir_registry }}/{{ leloir_image_name }}:{{ leloir_image_tag }}"
                imagePullPolicy: Always
                command: ["/leloir-memory-mcp"]
                env:
                  - name: LELOIR_DATABASE_DSN
                    valueFrom:
                      secretKeyRef:
                        name: postgres-leloir-credentials
                        key: DSN
                ports:
                  - containerPort: 8090
                    name: http
                resources:
                  requests: {cpu: "50m", memory: "64Mi"}
                  limits: {cpu: "250m", memory: "128Mi"}
                readinessProbe:
                  httpGet: {path: /healthz, port: 8090}
                  initialDelaySeconds: 3
                  periodSeconds: 10

- name: Create leloir-memory-mcp Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: leloir-memory-mcp
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-memory-mcp
      spec:
        type: ClusterIP
        selector:
          app: leloir-memory-mcp
        ports:
          - name: http
            port: 8090
            targetPort: 8090

- name: Ingress-lock de leloir-memory-mcp (sólo el gateway — el ancla de confianza del header)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: leloir-memory-mcp-ingress-lock
        namespace: "{{ leloir_namespace }}"
        labels:
          app.kubernetes.io/managed-by: leloir
      spec:
        endpointSelector:
          matchLabels:
            app: leloir-memory-mcp
        ingress:
          # Zero Trust L3/L4 (spec-m20): el gateway debe presentar su identidad
          # SPIFFE (mTLS por eBPF) — no basta con "venir del ns leloir".
          - fromEndpoints:
              - matchLabels:
                  app: leloir-mcp-gateway
            authentication:
              mode: "required"
          # kubelet (probes) llega como host — SIN identidad SPIFFE, no exige mTLS.
          - fromEntities: [host]

# mTLS (SPIFFE) sobre el path de DATOS → postgres-leloir (spec-m20 rollout, #3b).
# postgres-leloir sirve TRES consumidores: control plane, memory-mcp Y litellm
# (base `litellm`, ns ai). Todos deben presentar identidad SPIFFE (mTLS por eBPF);
# el host (probes/init) no. Postgres es interno → default-deny seguro.
# OJO: si se agrega un consumidor nuevo de la DB, hay que sumarlo acá o queda
# bloqueado (así se rompió litellm la primera vez).
- name: mTLS-lock del path a postgres-leloir (CP + memory-mcp + litellm con SPIFFE)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: postgres-leloir-mtls-lock
        namespace: "{{ leloir_namespace }}"
        labels:
          app.kubernetes.io/managed-by: leloir
      spec:
        endpointSelector:
          matchLabels:
            app: postgres-leloir
        ingress:
          - authentication:
              mode: "required"
            fromEndpoints:
              - matchLabels:
                  app: leloir-controlplane
              - matchLabels:
                  app: leloir-memory-mcp
              - matchLabels:
                  io.kubernetes.pod.namespace: "{{ leloir_litellm_namespace | default('ai') }}"
                  app.kubernetes.io/name: litellm
            toPorts:
              - ports:
                  - port: "5432"
                    protocol: TCP
          - fromEntities: [host, remote-node]

- name: Wait for leloir-mcp-gateway rollout
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/leloir-mcp-gateway -n {{ leloir_namespace }} --timeout=120s
  register: gateway_rollout
  until: gateway_rollout.rc == 0
  retries: 6
  delay: 10
  changed_when: false

# ─── leloir-webhook-receiver (#2, alert real → Leloir) ───────────────────────
# Edge que traduce Alertmanager/Slack/PagerDuty/Azure/CloudWatch → formato
# normalizado y forwardea a /api/v1/alerts del control plane. Misma imagen,
# command distinto. Conecta el Prometheus/Alertmanager REAL del cluster a Leloir.

- name: Create leloir-webhook-receiver ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: leloir-webhook-config
        namespace: "{{ leloir_namespace }}"
      data:
        webhook.yaml: |
          listenAddr: ":8081"
          forwardTo: "http://leloir-controlplane.{{ leloir_namespace }}.svc.cluster.local"
          maxRequestSize: 1048576
          forwardTimeout: 10s
          dedupWindow: 5m
          forwardMaxRetries: 2
          observability: {metrics: {enabled: true}}

- name: Deploy leloir-webhook-receiver
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: leloir-webhook-receiver
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-webhook-receiver
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: leloir-webhook-receiver
        template:
          metadata:
            labels:
              app: leloir-webhook-receiver
          spec:
            nodeSelector:
              kubernetes.io/arch: arm64
              storage: rk1-longhorn
            tolerations:
              - operator: Exists
            containers:
              - name: receiver
                image: "{{ leloir_registry }}/{{ leloir_image_name }}:{{ leloir_image_tag }}"
                imagePullPolicy: Always
                command: ["/leloir-webhook-receiver"]
                args: ["--config=/etc/leloir/webhook.yaml"]
                ports:
                  - containerPort: 8081
                    name: http
                readinessProbe:
                  httpGet: {path: /healthz, port: 8081}
                  initialDelaySeconds: 5
                  periodSeconds: 10
                volumeMounts:
                  - name: cfg
                    mountPath: /etc/leloir
                    readOnly: true
            volumes:
              - name: cfg
                configMap:
                  name: leloir-webhook-config

- name: Create leloir-webhook-receiver Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: leloir-webhook-receiver
        namespace: "{{ leloir_namespace }}"
        labels:
          app: leloir-webhook-receiver
      spec:
        type: ClusterIP
        selector:
          app: leloir-webhook-receiver
        ports:
          - name: http
            port: 8081
            targetPort: 8081

# AlertmanagerConfig: rutea al receiver las alertas con routeToLeloir=true. Sólo
# AGREGA una ruta al Alertmanager compartido (kube-prometheus-stack) — OnNamespace
# le suma namespace={{ leloir_namespace }} solo. Idempotente; requiere el operator.
- name: Route matching alerts to Leloir (AlertmanagerConfig)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1alpha1
      kind: AlertmanagerConfig
      metadata:
        name: leloir-route
        namespace: "{{ leloir_namespace }}"
        labels:
          app.kubernetes.io/managed-by: leloir
      spec:
        route:
          receiver: leloir-webhook
          groupBy: ["alertname"]
          groupWait: 3s
          groupInterval: 10s
          repeatInterval: 2m
          matchers:
            - name: routeToLeloir
              value: "true"
              matchType: "="
        receivers:
          - name: leloir-webhook
            webhookConfigs:
              - url: "http://leloir-webhook-receiver.{{ leloir_namespace }}.svc.cluster.local:8081/webhook/alertmanager"
                sendResolved: false
  failed_when: false   # el operator/CRD puede no estar en todos los clusters

- name: Create ServiceMonitor for leloir-mcp-gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: leloir-mcp-gateway
        namespace: "{{ leloir_namespace }}"
        labels:
          release: kube-prometheus-stack
      spec:
        selector:
          matchLabels:
            app: leloir-mcp-gateway
        endpoints:
          - port: http
            path: /metrics
            interval: 30s

# ─── Observabilidad: ServiceMonitor + dashboards Grafana ──────────────────────
# kube-prometheus-stack scrapea /metrics; el sidecar de Grafana descubre los
# dashboards por la label grafana_dashboard=1.

- name: Create ServiceMonitor for leloir-controlplane
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: leloir-controlplane
        namespace: "{{ leloir_namespace }}"
        labels:
          release: kube-prometheus-stack
      spec:
        selector:
          matchLabels:
            app: leloir-controlplane
        endpoints:
          - port: http
            path: /metrics
            interval: 30s

- name: Install Leloir Grafana dashboards (auto-discovered by the sidecar)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "leloir-{{ item.name }}"
        namespace: "{{ leloir_monitoring_namespace | default('monitoring') }}"
        labels:
          grafana_dashboard: "1"
      data: "{{ item.data }}"
  loop:
    - name: dashboard
      data:
        leloir-dashboard.json: "{{ lookup('url', leloir_git_raw ~ '/deploy/grafana/leloir-dashboard.json', split_lines=false) }}"
    - name: fleet-dashboard
      data:
        leloir-fleet-dashboard.json: "{{ lookup('url', leloir_git_raw ~ '/deploy/grafana/leloir-fleet-dashboard.json', split_lines=false) }}"
    # platform + tenant faltaban en el loop (drift encontrado 11/07): el repo
    # tiene 4 dashboards y el check-docs-sync los referencia todos.
    - name: platform-dashboard
      data:
        leloir-platform-dashboard.json: "{{ lookup('url', leloir_git_raw ~ '/deploy/grafana/leloir-platform-dashboard.json', split_lines=false) }}"
    - name: tenant-dashboard
      data:
        leloir-tenant-dashboard.json: "{{ lookup('url', leloir_git_raw ~ '/deploy/grafana/leloir-tenant-dashboard.json', split_lines=false) }}"
  loop_control:
    label: "{{ item.name }}"

# ─── Migración a GitOps (solo en modo oidc) ───────────────────────────────────
# Elimina los recursos gestionados directamente por Ansible para cederlos al
# Helm chart via ArgoCD (deploy/homelab/leloir/).
# Idempotente: falla silenciosamente si los recursos ya no existen.

- name: Remove Ansible-managed ConfigMap (ArgoCD Helm lo recrea)
  when: leloir_auth_mode == "oidc"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: leloir-config
    namespace: "{{ leloir_namespace }}"

- name: Remove Ansible-managed Deployment (ArgoCD Helm lo recrea)
  when: leloir_auth_mode == "oidc"
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: leloir-controlplane
    namespace: "{{ leloir_namespace }}"

- name: Remove Ansible-managed Service (ArgoCD Helm lo recrea)
  when: leloir_auth_mode == "oidc"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Service
    name: leloir-controlplane
    namespace: "{{ leloir_namespace }}"

- name: Remove Ansible-managed HTTPRoute (ArgoCD Helm lo recrea)
  when: leloir_auth_mode == "oidc"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: leloir
    namespace: "{{ leloir_namespace }}"

# ─── Tool server de Kubernetes (tools reales para el flagship) ───────────────
# Read-only (get_pods/logs/events), RBAC scoped. El gateway lo registra como el
# server "kubernetes" (leloir_gateway_servers) → investigación GROUNDED gobernada.
- name: Deploy the Kubernetes tool server (grounded investigations)
  ansible.builtin.command:
    cmd: kubectl apply -f {{ leloir_git_raw }}/deploy/demo/k8s-tools.yaml
  changed_when: false

# Living demo — los 3 modos de governance (deploy/demo/modes). Cada modo = un
# tenant real (Tenant + TenantBudget + AgentRegistration + MCPServer + AlertRoute
# + workload roto). Idempotente. El namespace-scoping por-tenant de las tools sale
# de leloir_gateway_servers (allowedNamespaces) — ya renderizado en la ConfigMap.
- name: Deploy the 3 governance-mode example tenants
  ansible.builtin.command:
    cmd: kubectl apply -f {{ leloir_git_raw }}/deploy/demo/modes/{{ item }}
  loop:
    - tenant-isolation-policy.yaml # admission policy + egress-lock (item 1, D-BB5) — PRIMERO
    - mode1-sdk-native.yaml
    - mode2-contain-blackbox.yaml
    - mode3-native-guardrails.yaml
    - mode4-opencode.yaml          # 4º modo: adapter genérico openaicompat (opencode)
    - governance-showcase.yaml     # los 5 CRD restantes (skill/notify/approval/investigation/scheduled)
  changed_when: false

# ─── GitOps homelab ApplicationSet ───────────────────────────────────────────
# Aplica el ApplicationSet al ArgoCD del homelab: gestiona Dex + control plane
# vía los Helm charts en deploy/homelab/ del repo leloir.

- name: Apply homelab ApplicationSet a ArgoCD
  when: leloir_auth_mode == "oidc" and leloir_homelab_appset_path != ""
  ansible.builtin.command:
    cmd: kubectl apply -f {{ leloir_homelab_appset_path }} -n argocd
  register: appset_apply
  changed_when: "'created' in appset_apply.stdout or 'configured' in appset_apply.stdout"

- name: Wait for leloir-controlplane rollout (oidc mode — ArgoCD managed)
  when: leloir_auth_mode == "oidc"
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/leloir-controlplane -n {{ leloir_namespace }} --timeout=180s
  register: leloir_oidc_rollout
  until: leloir_oidc_rollout.rc == 0
  retries: 12
  delay: 15
  changed_when: false

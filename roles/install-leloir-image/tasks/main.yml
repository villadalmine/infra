# Build leloir-controlplane ARM64 image using Argo Workflows + Kaniko.
# Uses inputs.artifacts.git for cloning — no initContainer needed.
# Build context is repo root so leloir-core/go.mod replace (../leloir-sdk) resolves.

- name: Create kaniko namespace
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ leloir_kaniko_namespace }}"
    state: present

- name: Create kaniko PVC for build cache
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: leloir-kaniko-cache
        namespace: "{{ leloir_kaniko_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ leloir_kaniko_storage_class }}"
        resources:
          requests:
            storage: "{{ leloir_kaniko_storage_size }}"

- name: Create Argo Workflow for leloir-controlplane build
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Workflow
      metadata:
        generateName: build-leloir-arm64-
        namespace: "{{ leloir_kaniko_namespace }}"
        labels:
          app: leloir-build
      spec:
        entrypoint: build-image
        nodeSelector:
          kubernetes.io/hostname: "{{ leloir_kaniko_node_hostname }}"
        tolerations:
          - key: "node.kubernetes.io/unreachable"
            operator: Exists
            effect: NoExecute
          - key: "node.kubernetes.io/not-ready"
            operator: Exists
            effect: NoExecute
        volumeClaimTemplates:
          - metadata:
              name: workspace
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: "{{ leloir_kaniko_workspace_storage_class }}"
              resources:
                requests:
                  storage: "{{ leloir_kaniko_workspace_storage_size }}"
        volumes:
          - name: cache
            persistentVolumeClaim:
              claimName: leloir-kaniko-cache
        templates:
          - name: build-image
            inputs:
              artifacts:
                - name: source
                  path: /workspace/source
                  git:
                    repo: "{{ leloir_git_repo }}"
                    revision: "{{ leloir_git_ref }}"
                    depth: 1
            container:
              image: gcr.io/kaniko-project/executor:latest
              args:
                # Dockerfile inside the repo — build context is repo root (SDK replace directive)
                - "--dockerfile=/workspace/source/leloir-core/Dockerfile.controlplane"
                - "--context=dir:///workspace/source"
                - "--cache=true"
                - "--cache-dir=/cache"
                - "--destination={{ leloir_registry }}/{{ leloir_image_name }}:{{ leloir_image_tag }}"
                - "--build-arg=VERSION={{ leloir_image_tag }}"
                - "--insecure"
                - "--skip-tls-verify"
                - "--snapshot-mode=redo"
                - "--compression=zstd"
                - "--compression-level=1"
              resources:
                requests:
                  cpu: "1"
                  memory: "2Gi"
                limits:
                  cpu: "4"
                  memory: "8Gi"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: cache
                  mountPath: /cache

- name: Wait for leloir build to complete
  ansible.builtin.shell: |
    WF=$(kubectl get workflow -n {{ leloir_kaniko_namespace }} \
         -l app=leloir-build \
         --sort-by=.metadata.creationTimestamp \
         -o jsonpath='{.items[-1].metadata.name}')
    kubectl wait workflow/"$WF" \
      -n {{ leloir_kaniko_namespace }} \
      --for=jsonpath='{.status.phase}'=Succeeded \
      --timeout=900s
  register: leloir_build_wait
  changed_when: false
  failed_when: leloir_build_wait.rc != 0

- name: Leloir build complete
  ansible.builtin.debug:
    msg: "leloir-controlplane image built and pushed to {{ leloir_registry }}/{{ leloir_image_name }}:{{ leloir_image_tag }}"

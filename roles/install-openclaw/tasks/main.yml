---
# ─── Load secrets (tokens, keys) ──────────────────────────────────────────────
- name: Load OpenClaw secrets
  ansible.builtin.include_vars:
    file: "{{ role_path }}/defaults/secrets.yml"
  failed_when: false  # graceful: empty vars if file missing

# ─── Storage dependency guard ─────────────────────────────────────────────────
- name: Ensure storage backend is installed before OpenClaw
  ansible.builtin.include_role:
    name: "{{ openclaw_storage_role }}"
  when: openclaw_storage_class != 'local-path' and openclaw_storage_role is defined and openclaw_storage_role != ''


# ─── Namespace ────────────────────────────────────────────────────────────────
- name: Ensure OpenClaw namespace exists
  ansible.builtin.shell:
    cmd: kubectl create namespace {{ openclaw_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

# ─── Secrets ──────────────────────────────────────────────────────────────────
- name: Render OpenClaw secret manifest
  ansible.builtin.template:
    src: openclaw-secret.yaml.j2
    dest: /tmp/openclaw-secret.yaml
    mode: "0600"

- name: Apply OpenClaw secret
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/openclaw-secret.yaml
  changed_when: false

- name: Remove temporary secret manifest
  ansible.builtin.file:
    path: /tmp/openclaw-secret.yaml
    state: absent

# ─── ConfigMap (openclaw.json + AGENTS.md) ───────────────────────────────────
- name: Render OpenClaw ConfigMap
  ansible.builtin.template:
    src: openclaw-configmap.yaml.j2
    dest: /tmp/openclaw-configmap.yaml

- name: Apply OpenClaw ConfigMap
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/openclaw-configmap.yaml
  changed_when: false

- name: Remove temporary ConfigMap manifest
  ansible.builtin.file:
    path: /tmp/openclaw-configmap.yaml
    state: absent

# ─── Storage (PVC) ────────────────────────────────────────────────────────────
- name: Render OpenClaw PVC manifest
  ansible.builtin.template:
    src: openclaw-pvc.yaml.j2
    dest: /tmp/openclaw-pvc.yaml

- name: Apply OpenClaw PVC
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/openclaw-pvc.yaml
  changed_when: false

- name: Remove temporary PVC manifest
  ansible.builtin.file:
    path: /tmp/openclaw-pvc.yaml
    state: absent

# ─── RBAC (modular, level-controlled) ────────────────────────────────────────
- name: Render OpenClaw RBAC manifest (level={{ openclaw_rbac_level }})
  ansible.builtin.template:
    src: openclaw-rbac.yaml.j2
    dest: /tmp/openclaw-rbac.yaml

- name: Apply OpenClaw RBAC
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/openclaw-rbac.yaml
  changed_when: false

- name: Remove temporary RBAC manifest
  ansible.builtin.file:
    path: /tmp/openclaw-rbac.yaml
    state: absent

# ─── Deployment ───────────────────────────────────────────────────────────────
- name: Render OpenClaw Deployment manifest
  ansible.builtin.template:
    src: openclaw-deployment.yaml.j2
    dest: /tmp/openclaw-deployment.yaml

- name: Apply OpenClaw Deployment
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/openclaw-deployment.yaml
  changed_when: false

- name: Remove temporary Deployment manifest
  ansible.builtin.file:
    path: /tmp/openclaw-deployment.yaml
    state: absent

# ─── Service + HTTPRoute ──────────────────────────────────────────────────────
- name: Render OpenClaw Service + HTTPRoute manifest
  ansible.builtin.template:
    src: openclaw-network.yaml.j2
    dest: /tmp/openclaw-network.yaml

- name: Apply OpenClaw Service + HTTPRoute
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/openclaw-network.yaml
  changed_when: false

- name: Remove temporary network manifest
  ansible.builtin.file:
    path: /tmp/openclaw-network.yaml
    state: absent

# ─── Smee Webhook Relay Cleanup ───────────────────────────────────────────────
- name: Remove standalone Smee Webhook Relay deployment (now a sidecar)
  ansible.builtin.command:
    cmd: kubectl delete deployment smee-client -n {{ openclaw_namespace }} --ignore-not-found
  changed_when: false

# ─── Wait for rollout ─────────────────────────────────────────────────────────
- name: Wait for OpenClaw deployment to be ready
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/openclaw -n {{ openclaw_namespace }} --timeout={{ openclaw_rollout_timeout | default('180s') }}
  changed_when: false
  register: openclaw_rollout
  failed_when: openclaw_rollout.rc != 0

- name: Show OpenClaw pod status
  ansible.builtin.command:
    cmd: kubectl get pods -n {{ openclaw_namespace }} -l app=openclaw
  changed_when: false

# ─── MCP Bridge Deadlock Bypass ───────────────────────────────────────────────
- name: Apply OpenClaw MCP Bridge deadlock bypass (inject approved scopes)
  ansible.builtin.shell: |
    kubectl exec -n {{ openclaw_namespace }} deployment/openclaw -c openclaw-gateway -- node -e '
    const fs = require("fs");
    const file = "/home/node/.openclaw/devices/paired.json";
    if (!fs.existsSync(file)) { console.log("NO_FILE"); process.exit(0); }
    const data = JSON.parse(fs.readFileSync(file, "utf8"));
    const key = "c7eb17c905d9c3b9fad7d2623ce4f58ab3fe7499a1a2b13a7efb81ae679b8fb8";
    if (data[key]) {
      const targetScopes = ["operator.read", "operator.write", "operator.approvals", "operator.pairing"];
      const currentScopes = JSON.stringify(data[key].scopes || []);
      const newScopes = JSON.stringify(targetScopes);
      if (currentScopes !== newScopes) {
        data[key].scopes = targetScopes;
        data[key].approvedScopes = targetScopes;
        if (data[key].tokens && data[key].tokens.operator) {
          data[key].tokens.operator.scopes = targetScopes;
        }
        fs.writeFileSync(file, JSON.stringify(data, null, 2), "utf8");
        console.log("CHANGED");
      } else {
        console.log("OK");
      }
    } else {
      console.log("NO_KEY");
    }
    '
  register: openclaw_bypass
  changed_when: "'CHANGED' in openclaw_bypass.stdout"

- name: Clean up stale pending requests if bypass was applied
  ansible.builtin.shell:
    cmd: kubectl exec -n {{ openclaw_namespace }} deployment/openclaw -c openclaw-gateway -- rm -f /home/node/.openclaw/devices/pending.json
  when: openclaw_bypass is changed

- name: Restart OpenClaw to load bypassed scopes
  ansible.builtin.shell:
    cmd: kubectl rollout restart -n {{ openclaw_namespace }} deployment/openclaw
  when: openclaw_bypass is changed

- name: Wait for OpenClaw to recover after bypass restart
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/openclaw -n {{ openclaw_namespace }} --timeout={{ openclaw_rollout_timeout | default("180s") }}
  changed_when: false
  when: openclaw_bypass is changed

# ─── A2A: orden de arranque (2026-06-10) ──────────────────────────────────────
# Hermes registra sus MCP servers SOLO al arrancar (3 intentos y abandona).
# En el bootstrap completo Hermes se despliega ANTES que OpenClaw, así que su
# server "openclaw" (bridge :18790) queda sin registrar. Tras desplegar OpenClaw,
# reiniciamos Hermes para que registre los 3 servers (kubernetes, kagent, openclaw).
- name: Check if Hermes deployment exists (A2A restart ordering)
  ansible.builtin.command:
    cmd: kubectl get deployment hermes-agent-mcp -n {{ openclaw_hermes_namespace | default('ai') }} --ignore-not-found -o name
  register: openclaw_hermes_dep
  changed_when: false

- name: Restart Hermes so it registers the OpenClaw MCP bridge
  ansible.builtin.command:
    cmd: kubectl rollout restart deployment/hermes-agent-mcp -n {{ openclaw_hermes_namespace | default('ai') }}
  when: openclaw_hermes_dep.stdout | trim != ''

- name: Wait for Hermes after A2A ordering restart
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/hermes-agent-mcp -n {{ openclaw_hermes_namespace | default('ai') }} --timeout=300s
  when: openclaw_hermes_dep.stdout | trim != ''
  changed_when: false

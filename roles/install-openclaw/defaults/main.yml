# ─────────────────────────────────────────────────────────────────────────────
# OpenClaw — Personal AI Gateway
# https://github.com/openclaw/openclaw
# Image: ghcr.io/openclaw/openclaw (multi-arch, arm64 supported natively)
# ─────────────────────────────────────────────────────────────────────────────

openclaw_version: "latest-honcho"
openclaw_namespace: "openclaw"
openclaw_image: "ghcr.io/villadalmine/openclaw-honcho"
openclaw_rollout_timeout: "300s"
openclaw_hostname: "openclaw.cluster.home"

# ─── Honcho Memory ────────────────────────────────────────────────────────────
openclaw_honcho_workspace: "openclaw"

# ─── Resource limits ──────────────────────────────────────────────────────────
# Schedule on RK1 (32 GB RAM). See AGENTS.md for node table.
openclaw_node_hostname: "srv-rk1-nvme-02"
openclaw_cpu_request: "500m"
openclaw_cpu_limit: "3000m"
openclaw_memory_request: "2Gi"
openclaw_memory_limit: "6Gi"

# Smee.io Webhook Relay URL
openclaw_smee_url: "https://smee.io/NibMMS9tqGdtxzN1"

# ─── Storage ──────────────────────────────────────────────────────────────────
openclaw_storage_size: "10Gi"
openclaw_storage_class: "longhorn-nvme"
openclaw_storage_role: ""


# ─── LiteLLM backend (shared in-cluster proxy) ───────────────────────────────
# Uses the shared LiteLLM proxy already in namespace 'ai'.
# All model traffic is tracked in Prometheus and visible in Grafana.
# To bypass LiteLLM and go direct to OpenRouter, set openclaw_llm_backend: "openrouter"
# and provide openclaw_openrouter_api_key in secrets.yml.
openclaw_llm_backend: "litellm"
openclaw_litellm_url: "http://litellm-proxy.ai.svc.cluster.local:4000"
openclaw_litellm_master_key: "{{ litellm_master_key }}"

# OpenClaw virtual model names (resolved by LiteLLM routing — ver install-litellm-proxy/tasks/main.yml):
#   openclaw-gemini     → openai/gpt-oss-20b:free (primary; tool calling sólido) + nemotron:free
#   gemini-free         → openai/gpt-oss-20b:free + meta-llama/llama-3.3-70b:free
#   gemini-free2        → nvidia/nemotron-3-super-120b-a12b:free (fallback)
#   Último fallback de todas las chains: paid-final (deepseek-v4-flash, pago barato)
# Use provider-prefixed model IDs to avoid client-side provider fallback.
# Set primary to the OpenRouter model ID exposed via LiteLLM.
# Default to the virtual model name resolved by LiteLLM so the client does not
# include a provider prefix. This helps prevent OpenClaw from triggering the
# provider routing logic that sends traffic to api.openai.com directly.
openclaw_model_primary: "litellm/openclaw-gemini"
# Fallbacks (optional) — keep as provider-prefixed where sensible.
openclaw_model_fallback1: "openrouter/qwen/qwen3-coder:free"
# gemini-2.0-flash-exp:free ya no existe en OpenRouter → gpt-oss-20b:free (jun-2026)
openclaw_model_fallback2: "openrouter/openai/gpt-oss-20b:free"

# ─── kubernetes-mcp sidecar ──────────────────────────────────────────────────
# Sidecar container that exposes Kubernetes MCP at http://127.0.0.1:8080/mcp.
# Same image used by hermes-agent-mcp. Uses the pod ServiceAccount token (no extra creds).
openclaw_mcp_k8s_image: "registry.registry:5000/ai/kubernetes-mcp-server"
openclaw_mcp_k8s_tag: "v0.0.60"

# ─── MCP Client & Agent timeouts (seconds) ───────────────────────────────────
openclaw_mcp_kubernetes_timeout: 120
openclaw_mcp_kagent_timeout: 300
openclaw_mcp_hermes_timeout: 600
openclaw_agent_timeout_seconds: 600

# ─── MCP Bridge sidecar (reverse A2A: Hermes → OpenClaw) ─────────────────────
# Wraps `openclaw mcp serve` (stdio) as streamable-http via supergateway.
# Exposes the same 11 messaging-bridge tools that Hermes exposes, but on
# the OpenClaw side — so Hermes can call OpenClaw's conversations/events.
# NetworkPolicy: allow hermes-agent-mcp (ai ns) → openclaw :18790
openclaw_mcp_bridge_enabled: true
openclaw_mcp_bridge_port: 18790

# ─── Honcho Memory Configuration ──────────────────────────────────────────────
# Self-hosted Honcho in-cluster. Workspace-scoped JWT key in secrets.yml (workspace: openclaw).
openclaw_honcho_url: "http://honcho-api.honcho.svc.cluster.local"
openclaw_honcho_timeout_ms: 90000   # kimi-free reasoning takes 18-57s; 30s was always timing out

# ─── Subagent endpoints (for NetworkPolicy + AGENTS.md) ──────────────────────
openclaw_holmes_url: "http://holmesgpt-holmes.ai.svc.cluster.local"
openclaw_kagent_url: "http://k8s-agent.kagent.svc.cluster.local:8080"
openclaw_hermes_url: "http://hermes-agent-mcp.ai.svc.cluster.local:8000"  # hermes gateway MCP port


openclaw_prometheus_url: "http://prometheus-operated.monitoring.svc.cluster.local:9090"

# ─── RBAC — Kubernetes permission level ──────────────────────────────────────
# Controls what ClusterRole/RoleBinding the ServiceAccount gets.
# Override per run: -e "openclaw_rbac_level=operator"
#
#  readonly      → get/list/watch only (safe default)
#  operator      → readonly + exec/logs + create/patch/delete jobs & deployments
#  admin         → namespaced admin (all resources in openclaw namespace)
#  cluster-admin → full cluster access (explicit, use carefully)
openclaw_rbac_level: "readonly"

# ─── Channel: Telegram ───────────────────────────────────────────────────────
# Token loaded from defaults/secrets.yml (gitignored — see secrets.yml.example).
openclaw_telegram_enabled: true
openclaw_telegram_allowed_users: ""   # overridden in secrets.yml
openclaw_telegram_dm_policy: "pairing"  # pairing | open

# ─── Audio: STT entrante + TTS saliente — 100% gratis, sin API keys ──────────
# STT: voice notes de Telegram → whisper-stt in-cluster (OpenAI-compatible).
#      Deploy con: --tags ai-stt (role install-whisper-stt).
# TTS: respuestas en audio vía Microsoft Edge neural TTS (sin key, best-effort).
#      auto: "inbound" = responde con audio SOLO cuando el usuario mandó audio.
# 2026-06-12: REACTIVADO — la causa del "models.0: Invalid input" era el campo
# `apiKey` dentro de tools.media.audio.models[] (el zod schema es .strict() y NO
# acepta apiKey; sí acepta provider/model/baseUrl/timeoutSeconds/headers).
# Validado contra el parser real del gateway (imagen latest-honcho digest 13bd3a5d).
# TTS: el único provider implementado en esta imagen es "microsoft" (alias "edge",
# node-edge-tts). NO existe provider openai/baseUrl para TTS → TTS local (piper)
# requiere upgrade de imagen. STT sí es 100% local (whisper-stt in-cluster).
openclaw_audio_stt_enabled: true
openclaw_stt_base_url: "http://whisper-stt.ai.svc.cluster.local:9000/v1"
openclaw_stt_timeout_seconds: 120   # CPU ARM64 — voice notes largos tardan
openclaw_tts_enabled: true
openclaw_tts_auto: "inbound"        # off | always | inbound | tagged
openclaw_tts_voice: "es-AR-TomasNeural"   # alt: es-AR-ElenaNeural (femenina)
openclaw_tts_lang: "es-AR"

# ─── Agent sandboxing ─────────────────────────────────────────────────────────
# DinD not supported on K3s without special setup. Keep off.
openclaw_sandbox_enabled: false

# ─── OpenClaw Gateway config ──────────────────────────────────────────────────
openclaw_gateway_bind: "lan"
openclaw_gateway_port: 18789
openclaw_gateway_auth_mode: "token"

# Agent system prompt — injected as agents.defaults.systemPromptOverride in openclaw.json
# This completely defines the agent's identity and instructions.
openclaw_agent_instructions: |
  Eres el agente principal de la homelab de tu usuario. Hablas español.
  El usuario te habla directamente por Telegram. Eres conciso, técnico y directo.

  ## ACCESO AL CLUSTER — USA TOOL CALLS, NO HTTP
  Tienes herramientas (tool calls) para acceder al cluster. NUNCA hagas requests HTTP al cluster.
  NUNCA pidas kubectl, kubeconfig ni nada al usuario — llama a las tools directamente.

  ## MCP "kubernetes" — inspección del cluster (read-only, rápido)
  Úsalo para: listar pods/namespaces/nodos, ver logs, eventos, estado general.
  - `namespaces_list` — todos los namespaces
  - `pods_list_in_namespace` (namespace) — pods de un namespace
  - `pods_get` (name, namespace) — detalle de un pod
  - `pods_log` (name, namespace) — logs de un pod
  - `nodes_top` — CPU/RAM de nodos
  - `resources_list` (apiVersion, kind, namespace?) — cualquier recurso K8s
  - `resources_get` (apiVersion, kind, name, namespace?) — recurso específico
  - `events_list` (namespace?) — eventos del cluster

  ## MCP "hermes" — messaging bridge + agente autónomo
  Hermes tiene su propio bot de Telegram y loop de razonamiento autónomo.
  Sus tools son un bridge de mensajería real — no ejecutan funciones simples,
  hacen que Hermes razone con su LLM + kubernetes MCP + kagent MCP.

  Tools disponibles:
  - `conversations_list` (platform?) → lista conversaciones activas de Hermes
  - `messages_send` (target, message) → envía mensaje al canal de Hermes; target="telegram:CHAT_ID"
  - `messages_read` (session_key, limit?) → lee historial de una conversación
  - `events_poll` (session_key, cursor, limit?) → eventos nuevos desde cursor (= message_id)
  - `events_wait` (session_key, timeout?) → espera bloqueante hasta nueva respuesta (max 90s)
  - `ask_hermes_agent` (question) → delega al AIAgent completo de Hermes (respuesta directa)

  Úsalo para:
  - Tareas de código, análisis profundo, investigación multi-paso → `ask_hermes_agent`
  - Debate técnico multi-turno → protocolo messages_send + events_wait (ver abajo)
  - Leer el historial de conversación de Hermes con el usuario → `messages_read`

  ## PROTOCOLO DE DEBATE CON HERMES
  Cuando el usuario pida "debatan sobre X", "consulta a Hermes sobre X", o antes de
  cualquier operación de escritura en el cluster:

  1. Forma tu posición inicial (2-3 oraciones, técnico y directo)
  2. `ask_hermes_agent("DEBATE T1/N — Tema: [X]\nMi posición (OpenClaw): [tu_posición]\nAnalizá pros/contras y dame tu contrapropuesta.")`
     → Hermes corre su AIAgent completo con sus MCPs y responde
  3. Lee la respuesta de Hermes
  4. Forma tu réplica integrando sus argumentos
  5. `ask_hermes_agent("DEBATE T2/N — Historial:\nOpenClaw T1: [tu_pos]\nHermes T1: [respuesta]\nMi réplica: [tu_réplica]\n¿Contraargumento?")`
  6. Repite pasando el historial acumulado, para N turnos (default 3, máximo 5)
  7. Sintetiza: posición consensuada o desacuerdo documentado → presenta al usuario

  OPCIONAL — mostrar debate al usuario en tiempo real:
  Después de cada turno: `messages_send(target="telegram:CHAT_ID", message="[Hermes dice] " + respuesta_hermes)`
  — esto muestra la respuesta de Hermes en su propio chat de Telegram para que el usuario lo siga en vivo.
  CHAT_ID: llama `conversations_list(platform="telegram")` y extrae el chat_id del session_key.

  Reglas del debate:
  - Pasá siempre el historial completo en cada turno para que Hermes tenga contexto
  - El debate es técnico: fundamentá con datos del cluster cuando sea relevante
  - Si Hermes tarda (ask_hermes_agent puede tardar hasta 60s) → esperá, no abortes
  - La síntesis final incluye quién argumentó qué y cuál fue el consenso

  ## MCP "kagent" — operaciones avanzadas (kubectl, helm, Cilium, Prometheus)
  Úsalo para: helm, métricas, debugging Cilium, operaciones kubectl complejas.
  Tools clave:
  - `helm_list_releases` (namespace?) — listar Helm releases
  - `helm_get_release` (name, namespace) — detalle de un release
  - `helm_upgrade` (name, chart, namespace, values?) — upgrade/install release
  - `k8s_get_resources` (resource, namespace?) — get recursos con kubectl
  - `k8s_describe_resource` (resource, name, namespace?) — describe
  - `k8s_get_pod_logs` (pod, namespace, container?) — logs
  - `k8s_get_events` (namespace?) — eventos
  - `k8s_apply_manifest` (manifest) — aplicar YAML (solo con aprobación explícita)
  - `k8s_scale` (resource, replicas, namespace) — escalar (solo con aprobación)
  - `k8s_delete_resource` (resource, name, namespace) — borrar (solo con aprobación)
  - `prometheus_query_tool` (query) — ejecutar PromQL
  - `prometheus_query_range_tool` (query, start, end, step) — rango de métricas
  - `prometheus_targets_tool` — estado de targets Prometheus
  - `cilium_status_and_version` — estado de Cilium
  - `cilium_get_endpoints_list` — endpoints Cilium
  - `cilium_validate_cilium_network_policies` — validar NetworkPolicies
  - `shell` (command) — ejecutar shell (solo con aprobación explícita del usuario)

  ## Cuándo usar cada MCP
  - Pregunta sobre pods/logs/estado → kubernetes MCP (más rápido)
  - Helm releases, versiones de charts → kagent `helm_list_releases`
  - Métricas Prometheus → kagent `prometheus_query_tool`
  - Debugging Cilium/red → kagent `cilium_*`
  - Operaciones de escritura (scale, apply, delete) → kagent + pide confirmación
  - Tareas de código, análisis multi-paso, investigación profunda → hermes MCP

  ## Cluster — K3s ARM64, 10 nodos
  Servers: srv-super6c-01-nvme (.85), -02 (.86), -03 (.87), -05-emmc (.104), -06-emmc (.105)
  Agents: srv-rk1-nvme-01 (.30), srv-rk1-nvme-02 (.48) ← este pod, -03 (.51), -04 (.54)
  Standalone: srv-super6c-04-emmc (.133) — no en K3s
  Gateway: 192.168.178.200 | Pi-hole: 192.168.178.203 | Dominio: *.cluster.home

  ## Namespaces clave
  monitoring (grafana, prometheus, alertmanager), ai (litellm-proxy, holmesgpt-holmes),
  argocd, kagent, openclaw, registry, pihole, kaniko

  ## Reglas
  - NUNCA leas Secrets
  - **DEBATE MANDATORIO CON HERMES**: Antes de proponer o solicitar aprobación al usuario para CUALQUIER operación de escritura, modificación o cambio en el clúster (como aplicar manifiestos, escalar deployments, borrar recursos, o ejecutar comandos en la shell), DEBES iniciar un debate técnico con el agente Hermes utilizando la herramienta `hermes__ask_hermes_agent`. Preséntale el cambio propuesto, pídele su opinión técnica y evalúen los riesgos juntos. Lleguen a una decisión consensuada de qué es lo mejor, y presenta la propuesta final al usuario detallando brevemente el consenso alcanzado en el debate.
  - Operaciones de escritura (apply/delete/scale/shell) solo con confirmación explícita del usuario
  - Nunca pidas kubectl al usuario — tienes acceso directo via tool calls
  - Si el usuario pide info del cluster → llama la tool, no inventes
  - Al final de cada respuesta que use tools, indica exactamente qué MCP y tool usaste.
    Son dos servidores distintos: "kubernetes" (sidecar local) y "kagent" (kagent-tools).
    Ejemplos: "_(vía kubernetes › pods_list_in_namespace)_" o "_(vía kagent › helm_list_releases)_"
    NUNCA digas "kubernetes" si usaste una tool de kagent y viceversa.
    Si usas hermes: "_(vía hermes › nombre_tool)_"

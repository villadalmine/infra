# Fix node identity (IP, MAC, Hostname) for all nodes.
# Problem: Inconsistent IPs, MAC rotation (on RK1), and hostname mismatches
# affect the stability of K3s clusters. DHCP assignment and MAC changes
# must be addressed universally for all nodes (Super6C, RK1).
#
# Fix: Use systemd-networkd for static MAC assignment and netplan for
# static IP configuration. Enforce hostname consistency using hostnamectl.
# Conditional restart of K3s services based on detected changes.
#
# Apply to all nodes in inventory:
#   ansible-playbook playbooks/fix-all-nodes.yml -i inventory/hosts.ini

- name: Detect ethernet interface name
  ansible.builtin.shell: |
    ip -o link show | grep -v lo | grep -v LOOPBACK | awk '{print $2}' | tr -d ':' | head -1
  register: eth_iface
  changed_when: false

- name: Ensure Cloud-Init does not overwrite hostname
  ansible.builtin.lineinfile:
    path: /etc/cloud/cloud.cfg
    regexp: '^preserve_hostname:'
    line: 'preserve_hostname: true'
    create: true

- name: Enforce hostname consistency
  ansible.builtin.command: hostnamectl set-hostname {{ inventory_hostname }}
  when: ansible_hostname != inventory_hostname

- name: Validate k3s service type (server or agent)
  ansible.builtin.shell: |
    systemctl is-active k3s.service && echo server || systemctl is-active k3s-agent.service && echo agent || echo none
  register: k3s_type
  failed_when: false

- name: Get current MAC address of ethernet interface
  ansible.builtin.shell: |
    cat /sys/class/net/{{ eth_iface.stdout }}/address
  register: current_mac
  changed_when: false

- name: Check if MAC address is already persistent
  ansible.builtin.command: cat /etc/systemd/network/10-{{ eth_iface.stdout }}-mac.link
  register: link_file_content
  failed_when: false

- name: Evaluate if MAC address is already correct
  ansible.builtin.set_fact:
    mac_correct: "{{ 'MACAddress=' ~ current_mac.stdout in link_file_content.stdout }}"

- name: Skip MAC change if already correct
  ansible.builtin.debug:
    msg: "MAC address is already fixed. No changes needed."
  when: mac_correct

- name: Show detected interface and MAC
  ansible.builtin.debug:
    msg: "Interface: {{ eth_iface.stdout }}, MAC: {{ current_mac.stdout }}"

- name: Create systemd-networkd link file to pin MAC address permanently
  ansible.builtin.copy:
    dest: "/etc/systemd/network/10-{{ eth_iface.stdout }}-mac.link"
    content: |
      [Match]
      OriginalName={{ eth_iface.stdout }}

      [Link]
      MACAddress={{ current_mac.stdout }}
      NamePolicy=keep kernel database onboard slot path
    owner: root
    group: root
    mode: "0644"
  register: link_file

- name: Disable cloud-init network management (prevents overwriting static config)
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network.cfg
    content: "network: {config: disabled}\n"
    owner: root
    group: root
    mode: "0644"

- name: Check current IP address
  ansible.builtin.shell: ip -json addr show
  register: ip_output

- name: Create static netplan config with pinned MAC and fixed IP
  ansible.builtin.template:
    src: static-ip.yaml.j2
    dest: /etc/netplan/60-static.yaml
    owner: root
    group: root
    mode: "0600"
  when: "'192.168.178.XX' not in ip_output.stdout"  # Replace XX with desired IP
  register: netplan_changed

- name: Apply netplan configuration
  ansible.builtin.command: netplan apply
  when: netplan_changed.changed or link_file.changed
  changed_when: true

- name: Restart k3s service if network changes detected on server
  ansible.builtin.systemd:
    name: k3s.service
    state: restarted
  when: k3s_type.stdout == 'server' and (netplan_changed.changed or link_file.changed)

- name: Restart k3s-agent service if network changes detected on agent
  ansible.builtin.systemd:
    name: k3s-agent.service
    state: restarted
  when: k3s_type.stdout == 'agent' and (netplan_changed.changed or link_file.changed)

- name: Reload systemd-networkd to pick up link file
  ansible.builtin.systemd:
    name: systemd-networkd
    state: restarted
  when: link_file.changed

---
# ─── Storage dependency guard ─────────────────────────────────────────────────
- name: Ensure storage backend is installed before Whisper STT
  ansible.builtin.include_role:
    name: "{{ whisper_stt_storage_role }}"
  when: whisper_stt_storage_class != 'local-path' and whisper_stt_storage_role is defined and whisper_stt_storage_role != ''

# ─── Namespace ────────────────────────────────────────────────────────────────
- name: Ensure namespace exists
  ansible.builtin.shell:
    cmd: kubectl create namespace {{ whisper_stt_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

# ─── PVC + Deployment + Service ───────────────────────────────────────────────
- name: Render Whisper STT manifest
  ansible.builtin.template:
    src: whisper-stt.yaml.j2
    dest: /tmp/whisper-stt.yaml

- name: Apply Whisper STT manifest
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/whisper-stt.yaml
  changed_when: false

- name: Remove temporary manifest
  ansible.builtin.file:
    path: /tmp/whisper-stt.yaml
    state: absent

# ─── Wait for rollout (first boot downloads the model) ────────────────────────
- name: Wait for Whisper STT deployment to be ready
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/whisper-stt -n {{ whisper_stt_namespace }} --timeout={{ whisper_stt_rollout_timeout }}
  changed_when: false

- name: Smoke test — list models via OpenAI-compatible API
  ansible.builtin.shell:
    cmd: >
      kubectl run whisper-stt-smoke --rm -i --restart=Never -n {{ whisper_stt_namespace }}
      --image=curlimages/curl:latest --
      curl -sf http://whisper-stt.{{ whisper_stt_namespace }}.svc.cluster.local:{{ whisper_stt_port }}/v1/models
  register: whisper_smoke
  changed_when: false
  failed_when: whisper_smoke.rc != 0

# tasks/main.yml for install-rknpu-pool
- name: Render NPU Pool manifest
  ansible.builtin.template:
    src: rk1-npu-pool.yaml.j2
    dest: /tmp/rk1-npu-pool.yaml
    mode: '0644'

- name: Apply NPU Pool
  kubernetes.core.k8s:
    state: present
    src: /tmp/rk1-npu-pool.yaml

- name: Clean temporary NPU Pool manifest
  ansible.builtin.file:
    path: /tmp/rk1-npu-pool.yaml
    state: absent

# Métricas del workflow-controller → Prometheus (kube-prometheus-stack).
# A MANO (no por values del chart): argo-workflows 1.0.14 rinde el ServiceMonitor con `scheme: http`
# aunque metricsConfig.secure=true, y el controller v4 sirve las métricas por HTTPS (self-signed) →
# el nativo del chart no scrapea. Cuando el chart lo arregle, migrar a controller.serviceMonitor.enabled.
# Da visibilidad de TODOS los workflows del cluster (builds kaniko, crones ai, deploys tormenta):
# argo_workflows_gauge{phase} alimenta la alerta ArgoWorkflowsFallados (PrometheusRule en el repo del juego,
# tormenta-solar/deploy/argo/monitoring.yaml — es del ns ai / dominio del juego).
apiVersion: v1
kind: Service
metadata:
  name: argo-workflows-controller-metrics
  namespace: argo
  labels:
    app.kubernetes.io/name: argo-workflows-workflow-controller
spec:
  selector:
    app.kubernetes.io/name: argo-workflows-workflow-controller
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argo-workflows-controller
  namespace: argo
  labels:
    release: kube-prometheus-stack        # lo que exige el serviceMonitorSelector del stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argo-workflows-workflow-controller
  endpoints:
    - port: metrics
      scheme: https
      interval: 60s
      tlsConfig:
        insecureSkipVerify: true          # cert self-signed del controller (métricas, sin secretos)

hermes_version: "latest"
hermes_namespace: ai
hermes_hostname: hermes.cluster.home

# Model configuration (Forced through LiteLLM)
hermes_model: "hermes-qwen"
hermes_temperature: 0.7
hermes_inference_provider: "openai"
hermes_openai_api_base: "http://litellm-proxy.ai.svc.cluster.local:4000/v1"
hermes_openai_api_key: "sk-hermes-internal"

hermes_cpu_limit: "4000m"
hermes_cpu_request: "1000m"
hermes_memory_limit: "8Gi"
hermes_memory_request: "2Gi"

# Schedule Hermes on the high-resource node.
hermes_node_hostname: "srv-rk1-nvme-01"

# Storage for ~/.hermes
hermes_storage_size: "10Gi"
hermes_storage_class: "longhorn-nvme"
hermes_storage_role: ""

# Platform integrations
# Telegram disabled: OpenClaw uses the same bot token → conflict if both run.
# Hermes runs as MCP subagent only (OpenClaw calls it via MCP, not Telegram).
hermes_telegram_enabled: true
hermes_discord_enabled: false

# Telegram gateway settings
hermes_telegram_allowed_users: "8492872858"
hermes_telegram_webhook_url: ""

# Local registry for ARM64 image
hermes_registry: "registry.registry:5000"
hermes_image_name: "ai/hermes-agent"
hermes_image_tag: "v2026.5.16-telegram"

# Kubernetes MCP sidecar
hermes_mcp_image_name: "ai/kubernetes-mcp-server"
hermes_mcp_image_tag: "v0.0.60"

# RBAC Elevation level for cluster operations:
# Options:
#   - readonly: read-only access (default, highly secure)
#   - operator: read/write/edit inside the 'ai' namespace (allow bot restarts)
#   - admin: read/write/edit across all cluster namespaces (allow fixing everything)
# Elevate dynamically using: make hermes-rbac LEVEL=admin
hermes_rbac_level: "admin"

# Hermes memory and learning loop settings
hermes_memory_provider: "honcho"
hermes_honcho_workspace: "hermes"
# Self-hosted Honcho in-cluster. Workspace-scoped JWT key in secrets.yml (workspace: hermes).
hermes_honcho_url: "http://honcho-api.honcho.svc.cluster.local"
hermes_memory_enabled: true
hermes_user_profile_enabled: true

# Hermes kubernetes MCP sidecar (localhost)
hermes_mcp_enabled: true
hermes_mcp_url: "http://127.0.0.1:8080/mcp"
hermes_mcp_timeout: 120
hermes_mcp_connect_timeout: 30

# STT — Groq Whisper (free tier). Key goes in secrets.yml.
hermes_stt_provider: "groq"
hermes_stt_model: "whisper-large-v3-turbo"

# kagent MCP — helm, prometheus, cilium ops
hermes_kagent_mcp_url: "http://kagent-tools.kagent.svc.cluster.local:8084/mcp"
hermes_kagent_mcp_timeout: 60
hermes_kagent_mcp_connect_timeout: 30

# A2A reverse — OpenClaw MCP bridge (Hermes → OpenClaw)
# supergateway wraps `openclaw mcp serve` as Streamable HTTP (endpoint: /mcp)
hermes_openclaw_mcp_url: "http://openclaw.openclaw.svc.cluster.local:18790/mcp"
hermes_openclaw_mcp_timeout: 120
hermes_openclaw_mcp_connect_timeout: 30

hermes_system_prompt: |
  You are an autonomous analysis and operations agent for a K3s homelab cluster.
  You have three MCP servers available: kubernetes, kagent, and openclaw.

  ## MCP "kubernetes" — read-only cluster inspection (fast)
  Use for: pods, logs, namespaces, nodes, events, deployments, services, PVCs, HTTPRoutes, NetworkPolicies, Cilium CRDs.
  Call tools directly — never use kubectl commands.

  ## MCP "kagent" — advanced cluster operations
  Use for: helm releases, Prometheus metrics, Cilium network debugging.
  Key tools:
  - helm_list_releases / helm_get_release — understand what's deployed
  - prometheus_query_tool (query) — run PromQL for metrics analysis
  - prometheus_query_range_tool (query, start, end, step) — time-range metrics
  - cilium_status_and_version / cilium_get_endpoints_list — network state
  - k8s_get_resources / k8s_describe_resource / k8s_get_pod_logs — kubectl-style ops
  - k8s_apply_manifest / k8s_scale / k8s_delete_resource — write ops (only with explicit user approval)

  ## MCP "openclaw" — messaging bridge to OpenClaw (Tito) — A2A reverse direction
  OpenClaw (Tito) is the primary agent the user talks to. You can reach it via its messaging bridge.
  Tools (same 11 bridge tools as your own messaging bridge):
  - conversations_list (platform?) → list OpenClaw's active conversations
  - messages_read (session_key, limit?) → read OpenClaw's conversation history with the user
  - messages_send (target, message) → send message TO the user via OpenClaw's Telegram bot
  - events_poll (session_key, cursor, limit?) → poll OpenClaw conversation events
  - events_wait (session_key, timeout?) → blocking wait for OpenClaw conversation events
  - ask_openclaw_agent (question) → run OpenClaw's full AIAgent reasoning loop and get response
  Use it for:
  - Proactively contacting the user when you detect something important (via OpenClaw's Telegram)
  - Running A2A debates where OpenClaw initiates (Tito calls ask_hermes_agent, you can now also call ask_openclaw_agent)
  - Reading what the user has been discussing with OpenClaw to avoid context gaps

  ## A2A Debate Protocol (when OpenClaw asks you via ask_hermes_agent)
  When you receive a debate request from OpenClaw:
  1. Read the debate prompt — it will include the topic and OpenClaw's position
  2. Reason with your MCPs (kubernetes, kagent, prometheus) to form your analysis
  3. Return your position clearly: pros/cons, technical assessment, counterargument if any
  4. If you need to start a debate with OpenClaw proactively, use ask_openclaw_agent with the same format

  ## Rules
  - Always use MCP tools — never HTTP calls or kubectl.
  - **DEBATE MANDATORIO CON TITO (OPENCLAW)**: Si se te solicita realizar o proponer cualquier operación de escritura, modificación o cambio en el clúster (a través de `kagent` o herramientas de escritura), DEBES usar `openclaw__ask_openclaw_agent` para consultar a Tito antes de ejecutar. Documenta el debate y el consenso en tu respuesta.
  - For multi-step tasks: gather context first (kubernetes MCP), then metrics if needed (kagent prometheus), then conclude.
  - Write operations (apply/scale/delete/shell) require explicit user confirmation before executing.
  - Never read Secrets.

hermes_version: "latest"
hermes_namespace: ai
hermes_hostname: hermes.cluster.home

# Model configuration (Forced through LiteLLM)
hermes_model: "hermes-qwen"
hermes_temperature: 0.7
hermes_inference_provider: "openai"
hermes_openai_api_base: "http://litellm-proxy.ai.svc.cluster.local:4000/v1"
hermes_openai_api_key: "sk-hermes-internal"

# Resource limits (CM4-friendly)
hermes_cpu_limit: "500m"
hermes_cpu_request: "100m"
hermes_memory_limit: "512Mi"
hermes_memory_request: "128Mi"

# Schedule Hermes on the high-resource node.
hermes_node_hostname: "srv-rk1-nvme-01"

# Storage for ~/.hermes
hermes_storage_size: "100Gi"
hermes_storage_class: "smb-nas"
hermes_storage_role: "install-cifs-nas"

# Platform integrations
# Telegram disabled: OpenClaw uses the same bot token → conflict if both run.
# Hermes runs as MCP subagent only (OpenClaw calls it via MCP, not Telegram).
hermes_telegram_enabled: false
hermes_discord_enabled: false

# Telegram gateway settings
hermes_telegram_allowed_users: "8492872858"
hermes_telegram_webhook_url: ""

# Local registry for ARM64 image
hermes_registry: "registry.registry:5000"
hermes_image_name: "ai/hermes-agent"
hermes_image_tag: "v2026.5.16-telegram"

# Kubernetes MCP sidecar
hermes_mcp_image_name: "ai/kubernetes-mcp-server"
hermes_mcp_image_tag: "v0.0.60"

# Hermes kubernetes MCP sidecar (localhost)
hermes_mcp_enabled: true
hermes_mcp_url: "http://127.0.0.1:8080/mcp"
hermes_mcp_timeout: 120
hermes_mcp_connect_timeout: 30

# STT — Groq Whisper (free tier). Key goes in secrets.yml.
hermes_stt_provider: "groq"
hermes_stt_model: "whisper-large-v3-turbo"

# kagent MCP — helm, prometheus, cilium ops
hermes_kagent_mcp_url: "http://kagent-tools.kagent.svc.cluster.local:8084/mcp"
hermes_kagent_mcp_timeout: 60
hermes_kagent_mcp_connect_timeout: 30

hermes_system_prompt: |
  You are an autonomous analysis and operations agent for a K3s homelab cluster.
  You have two MCP servers available:

  ## MCP "kubernetes" — read-only cluster inspection (fast)
  Use for: pods, logs, namespaces, nodes, events, deployments, services, PVCs, HTTPRoutes, NetworkPolicies, Cilium CRDs.
  Call tools directly — never use kubectl commands.

  ## MCP "kagent" — advanced cluster operations
  Use for: helm releases, Prometheus metrics, Cilium network debugging.
  Key tools:
  - helm_list_releases / helm_get_release — understand what's deployed
  - prometheus_query_tool (query) — run PromQL for metrics analysis
  - prometheus_query_range_tool (query, start, end, step) — time-range metrics
  - cilium_status_and_version / cilium_get_endpoints_list — network state
  - k8s_get_resources / k8s_describe_resource / k8s_get_pod_logs — kubectl-style ops
  - k8s_apply_manifest / k8s_scale / k8s_delete_resource — write ops (only with explicit user approval)

  ## Rules
  - Always use MCP tools — never HTTP calls or kubectl.
  - For multi-step tasks: gather context first (kubernetes MCP), then metrics if needed (kagent prometheus), then conclude.
  - Write operations (apply/scale/delete/shell) require explicit user confirmation before executing.
  - Never read Secrets.

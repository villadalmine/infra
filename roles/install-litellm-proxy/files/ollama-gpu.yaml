# Ollama (llama.cpp) on the GPU node with a HAMi vGPU slice.
# vLLM needs CC>=7.0; the P4 (6.1) / M4000 (5.2) are below it, so Ollama is the right
# server for these cards. Served at http://ollama.ai.svc.cluster.local:11434 (OpenAI API
# at /v1). LiteLLM routes a `local-gpu` model to it; token/spend metering is handled by
# LiteLLM's existing Prometheus metrics.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ai
spec:
  accessModes: ["ReadWriteOnce"]
  # local-path (node-local) — the pod is pinned to srv-t7910 for the GPU, and t7910 is
  # NOT a Longhorn node (Longhorn runs only on the RK1s). A model cache is re-downloadable
  # so node-local is fine. (longhorn-nvme would fail: node.longhorn.io srv-t7910 not found.)
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
  labels: { app: ollama }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      nodeSelector:
        kubernetes.io/hostname: srv-t7910
      containers:
        - name: ollama
          image: ollama/ollama:latest
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
          ports:
            - containerPort: 11434
          resources:
            limits:
              nvidia.com/gpu: 1
              nvidia.com/gpumem: 6000    # HAMi VRAM slice (fits P4 7680 / M4000 8192)
              nvidia.com/gpucores: 80
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
  labels: { app: ollama }
spec:
  selector: { app: ollama }
  ports:
    - name: http
      port: 11434
      targetPort: 11434
  type: ClusterIP

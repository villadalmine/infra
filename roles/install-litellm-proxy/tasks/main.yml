# LiteLLM proxy deployment with multi-tenant API tokens.
# Metrics enabled for Prometheus discovery.

- name: Load OpenRouter API keys (from litellm-proxy secrets)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../roles/install-litellm-proxy/defaults/secrets.yml"

- name: Create LiteLLM namespace
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ litellm_namespace }}"
    state: present

- name: Create LiteLLM secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: litellm-secrets
        namespace: "{{ litellm_namespace }}"
      type: Opaque
      stringData:
        OPENROUTER_API_KEY: "{{ hermes_openrouter_api_key | default('') }}"
        HOLMES_OPENROUTER_API_KEY: "{{ holmes_openrouter_api_key | default('') }}"
        KAGENT_OPENROUTER_API_KEY: "{{ kagent_openrouter_api_key | default('') }}"
        OPENCLAW_OPENROUTER_API_KEY: "{{ openclaw_openrouter_api_key | default('') }}"
  # Always create secret — pod references it unconditionally.
  # Keys are empty strings when secrets.yml is missing (local-only mode).

- name: Create LiteLLM proxy ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: litellm-proxy-config
        namespace: "{{ litellm_namespace }}"
      data:
        config.yaml: |
          model_list:
            # ── Local GPU routes (Ollama at 192.168.178.90 — srv-t7910 offline, restore when GPU node returns) ──
            # - model_name: local-fast
            #   litellm_params:
            #     model: openai/qwen2.5-coder:7b
            #     api_base: http://192.168.178.90:11434/v1
            #     api_key: "dummy"
            # - model_name: local-llama
            #   litellm_params:
            #     model: openai/llama3.1:8b
            #     api_base: http://192.168.178.90:11434/v1
            #     api_key: "dummy"
            # - model_name: local-coder-7b
            #   litellm_params:
            #     model: openai/qwen2.5-coder:7b-instruct-q8_0
            #     api_base: http://192.168.178.90:11436/v1
            #     api_key: "dummy"
            # - model_name: local-codestral
            #   litellm_params:
            #     model: openai/codestral:latest
            #     api_base: http://192.168.178.90:11436/v1
            #     api_key: "dummy"
            # - model_name: local-deepseek
            #   litellm_params:
            #     model: openai/deepseek-coder-v2:16b
            #     api_base: http://192.168.178.90:11436/v1
            #     api_key: "dummy"

            # ── Local TuringPi 2 RK1 NPU Pool (Primary routes for ALL services) ──
            # 4x RK1 Nodes running Llama-3.1-8B-Instruct on RKNPU (instantly available, 0 cost)
            - model_name: rk1-npu-local
              litellm_params:
                model: openai/llama-3.1-8b-instruct
                api_base: http://rk1-npu-01.ai.svc.cluster.local:8080/v1
                api_key: "dummy"
              model_info:
                max_input_tokens: 4096
            - model_name: rk1-npu-local
              litellm_params:
                model: openai/llama-3.1-8b-instruct
                api_base: http://rk1-npu-02.ai.svc.cluster.local:8080/v1
                api_key: "dummy"
              model_info:
                max_input_tokens: 4096
            - model_name: rk1-npu-local
              litellm_params:
                model: openai/llama-3.1-8b-instruct
                api_base: http://rk1-npu-03.ai.svc.cluster.local:8080/v1
                api_key: "dummy"
              model_info:
                max_input_tokens: 4096
            - model_name: rk1-npu-local
              litellm_params:
                model: openai/llama-3.1-8b-instruct
                api_base: http://rk1-npu-04.ai.svc.cluster.local:8080/v1
                api_key: "dummy"
              model_info:
                max_input_tokens: 4096

            # ── hermes-qwen → nemotron free + gpt-oss free (OPENROUTER key, separate from openclaw's OPENCLAW key) ──
            - model_name: hermes-qwen
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: hermes-qwen
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/OPENROUTER_API_KEY

            # ── holmes-llama → cloud free tier (Holmes HOLMES key) ──
            - model_name: holmes-llama
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY
            - model_name: holmes-llama
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY

            # ── gpt-5.4 & openai/gpt-5.4 → cloud free tier (Holmes alias, HOLMES key) ──
            - model_name: gpt-5.4
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY
            - model_name: gpt-5.4
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY
            - model_name: openai/gpt-5.4
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY
            - model_name: openai/gpt-5.4
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY

            # ── local-reason → cloud free tier (Holmes alias) ──
            - model_name: local-reason
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY
            - model_name: local-reason
              litellm_params:
                model: openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY

            # ── openclaw-gemini → gpt-oss-120b free (tool calling sólido, verificado PONG 2026-06-09) + nemotron free ──
            # gemma-4 reemplazado: tool calling poco confiable para agente MCP-heavy.
            # drop_params strips thinking/budget_tokens for non-Claude models (prevents empty response)
            # Ambas entradas usan OPENCLAW key para atribución de costos correcta en Grafana.
            - model_name: openclaw-gemini
              litellm_params:
                model: openrouter/openai/gpt-oss-120b:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
                drop_params: true
            - model_name: openclaw-gemini
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
                drop_params: true

            # ── gpt-4o & openai/gpt-4o → free first (gpt-oss + llama 3.3 70B free) via OPENCLAW key ──
            - model_name: gpt-4o
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            - model_name: gpt-4o
              litellm_params:
                model: openrouter/meta-llama/llama-3.3-70b-instruct:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            - model_name: openai/gpt-4o
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            - model_name: openai/gpt-4o
              litellm_params:
                model: openrouter/meta-llama/llama-3.3-70b-instruct:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY

            # ── gemini-free & openai/gemini-free → free (gpt-oss + llama 3.3 70B free) via OPENCLAW key ──
            - model_name: gemini-free
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            - model_name: gemini-free
              litellm_params:
                model: openrouter/meta-llama/llama-3.3-70b-instruct:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            - model_name: openai/gemini-free
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            - model_name: openai/gemini-free
              litellm_params:
                model: openrouter/meta-llama/llama-3.3-70b-instruct:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY

            # ── OpenRouter Cloud Models (Fallbacks only) ──
            - model_name: free2
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/OPENROUTER_API_KEY
            # cheap: qwen-turbo eliminado de OpenRouter (404) → deepseek-v4-flash (pago barato, verificado)
            - model_name: cheap
              litellm_params:
                model: openrouter/deepseek/deepseek-v4-flash
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: qwen-pro
              litellm_params:
                model: openrouter/qwen/qwen3.6-plus
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: holmes-free2
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY
            - model_name: holmes-cheap
              litellm_params:
                model: openrouter/deepseek/deepseek-v4-flash
                api_key: os.environ/HOLMES_OPENROUTER_API_KEY
            - model_name: gemini-free2
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            # kagent-orchestrator: qwen-turbo 404 → gpt-oss-20b free (tool calling)
            - model_name: kagent-orchestrator
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/KAGENT_OPENROUTER_API_KEY
            - model_name: free
              litellm_params:
                model: openrouter/qwen/qwen3-coder:free
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: openclaw-cheap
              litellm_params:
                model: openrouter/deepseek/deepseek-v4-flash
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            - model_name: deepseek-free
              litellm_params:
                model: openrouter/deepseek/deepseek-v4-flash
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            - model_name: deepseek-pro
              litellm_params:
                model: openrouter/deepseek/deepseek-v4-pro
                api_key: os.environ/OPENCLAW_OPENROUTER_API_KEY
            - model_name: claude-sonnet
              litellm_params:
                model: openrouter/anthropic/claude-sonnet-4-5
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: gemini-flash
              litellm_params:
                model: openrouter/google/gemini-2.0-flash-001
                api_key: os.environ/OPENROUTER_API_KEY
            # ── default → nemotron-super free (chain: kimi-free → gpt-oss-free → llama70b-free → paid-final) ──
            - model_name: default
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/OPENROUTER_API_KEY

            # ── Free Models and Aliases ──
            - model_name: nemotron
              litellm_params:
                model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: kimi-free
              litellm_params:
                model: openrouter/moonshotai/kimi-k2.6:free
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: gemma4-free
              litellm_params:
                model: openrouter/google/gemma-4-31b-it:free
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: hermes-free
              litellm_params:
                model: openrouter/qwen/qwen3-coder:free
                api_key: os.environ/OPENROUTER_API_KEY
            # 2ª entrada balanceada: qwen3-coder:free saturado upstream (timeouts >25s, 2026-06-09)
            - model_name: hermes-free
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: hermes-free-fallback
              litellm_params:
                model: openrouter/moonshotai/kimi-k2.6:free
                api_key: os.environ/OPENROUTER_API_KEY
            # gpt-oss-free: mejor free para código/tool calling (jun-2026, Apache 2.0, ~o3-mini en code)
            - model_name: gpt-oss-free
              litellm_params:
                model: openrouter/openai/gpt-oss-20b:free
                api_key: os.environ/OPENROUTER_API_KEY
            - model_name: llama70b-free
              litellm_params:
                model: openrouter/meta-llama/llama-3.3-70b-instruct:free
                api_key: os.environ/OPENROUTER_API_KEY
            # r1-free: razonador free (no hay deepseek free en jun-2026; nemotron reasoning verificado PONG)
            - model_name: r1-free
              litellm_params:
                model: openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
                api_key: os.environ/OPENROUTER_API_KEY
            # OJO: deepseek4v-free es PAGO (deepseek-v4-flash, barato) — nombre histórico.
            # Se mantiene como alias; en las chains se usa paid-final como último escalón.
            - model_name: deepseek4v-free
              litellm_params:
                model: openrouter/deepseek/deepseek-v4-flash
                api_key: os.environ/OPENROUTER_API_KEY
            # paid-final: ÚNICO escalón pago de las fallback chains (verificado funcionando 2026-05-28)
            - model_name: paid-final
              litellm_params:
                model: openrouter/deepseek/deepseek-v4-flash
                api_key: os.environ/OPENROUTER_API_KEY
            # qwen3.6-plus:free ya no existe → qwen3-next-80b (free, verificado en catálogo; a veces 429 upstream)
            - model_name: qwen36-free
              litellm_params:
                model: openrouter/qwen/qwen3-next-80b-a3b-instruct:free
                api_key: os.environ/OPENROUTER_API_KEY

            # ── Embedding Models (for Honcho Memory) ──
            - model_name: text-embedding-3-small
              litellm_params:
                model: openai/text-embedding-3-small
                api_base: https://openrouter.ai/api/v1
                api_key: os.environ/OPENROUTER_API_KEY

          litellm_settings:
            modify_params: true
            router_settings:
              routing_strategy: least_busy
              allowed_fails: 3
              cooldown_time: 30
            fallbacks:
              # Política: SIEMPRE free primero, paid-final (deepseek-v4-flash) como ÚNICO escalón pago al final.
              # Free actualizados jun-2026: gpt-oss-free, llama70b-free, r1-free, kimi-free, gemma4-free, free2 (nemotron).
              - {"hermes-qwen": ["free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"holmes-llama": ["holmes-free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"gpt-5.4": ["holmes-free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"openai/gpt-5.4": ["holmes-free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"local-reason": ["holmes-free2", "r1-free", "gpt-oss-free", "paid-final"]}
              - {"openclaw-gemini": ["gpt-oss-free", "llama70b-free", "free2", "paid-final"]}
              - {"gpt-4o": ["gpt-oss-free", "llama70b-free", "free2", "paid-final"]}
              - {"openai/gpt-4o": ["gpt-oss-free", "llama70b-free", "free2", "paid-final"]}
              - {"gemini-free": ["gpt-oss-free", "llama70b-free", "free2", "paid-final"]}
              - {"openai/gemini-free": ["gpt-oss-free", "llama70b-free", "free2", "paid-final"]}
              - {"rk1-npu-local": ["free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"nemotron": ["gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"hermes-free": ["hermes-free-fallback", "gpt-oss-free", "free2", "paid-final"]}
              # 2026-06-10: kimi-free no tenía chain → 429 upstream dejaba a Hermes y Honcho sin respuesta
              - {"kimi-free": ["gpt-oss-free", "free2", "llama70b-free", "paid-final"]}
              - {"deepseek4v-free": ["free2", "gpt-oss-free", "paid-final"]}
              - {"kagent-orchestrator": ["free2", "llama70b-free", "paid-final"]}
              - {"default": ["kimi-free", "gpt-oss-free", "llama70b-free", "paid-final"]}
            request_timeout: 120
            num_retries: 1
            context_window_fallbacks:
              # Verified 2026-05-28: free2 handles 33K+ token contexts in ~10s (nemotron-120b, fast)
              # Contextos: gpt-oss-free/llama70b-free 128K, free2 (nemotron) 33K+ verificado, paid-final 128K.
              - {"hermes-qwen": ["free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"holmes-llama": ["holmes-free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"gpt-5.4": ["holmes-free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"openai/gpt-5.4": ["holmes-free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"local-reason": ["holmes-free2", "r1-free", "gpt-oss-free", "paid-final"]}
              - {"openclaw-gemini": ["gpt-oss-free", "llama70b-free", "free2", "paid-final"]}
              - {"gpt-4o": ["gpt-oss-free", "llama70b-free", "free2", "paid-final"]}
              - {"openai/gpt-4o": ["gpt-oss-free", "llama70b-free", "free2", "paid-final"]}
              - {"rk1-npu-local": ["free2", "gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"nemotron": ["gpt-oss-free", "llama70b-free", "paid-final"]}
              - {"hermes-free": ["hermes-free-fallback", "gpt-oss-free", "free2", "paid-final"]}
              - {"kimi-free": ["gpt-oss-free", "free2", "llama70b-free", "paid-final"]}
              - {"deepseek4v-free": ["free2", "gpt-oss-free", "paid-final"]}
              - {"kagent-orchestrator": ["free2", "llama70b-free", "paid-final"]}
              - {"default": ["kimi-free", "gpt-oss-free", "llama70b-free", "paid-final"]}
            set_verbose: true
            success_callback: ["prometheus"]
            failure_callback: ["prometheus"]

          general_settings:
            master_key: "{{ litellm_master_key }}"

- name: Deploy LiteLLM proxy
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: litellm-proxy
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm-proxy
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: litellm-proxy
        template:
          metadata:
            labels:
              app: litellm-proxy
          spec:
            # 2026-06-10: pin a RK1 — sin nodeSelector caía en una Pi de 8GB
            # y el pull de main-latest + la carga del proxy la ahogaban.
            nodeSelector:
              kubernetes.io/hostname: "{{ litellm_node_hostname | default('srv-rk1-nvme-04') }}"
            containers:
              - name: litellm-proxy
                image: ghcr.io/berriai/litellm:main-latest
                ports:
                  - containerPort: 4000
                env:
                  - name: OPENROUTER_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-secrets
                        key: OPENROUTER_API_KEY
                  - name: HOLMES_OPENROUTER_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-secrets
                        key: HOLMES_OPENROUTER_API_KEY
                  - name: KAGENT_OPENROUTER_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-secrets
                        key: KAGENT_OPENROUTER_API_KEY
                  - name: OPENCLAW_OPENROUTER_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-secrets
                        key: OPENCLAW_OPENROUTER_API_KEY
                  - name: LITELLM_MASTER_KEY
                    value: "{{ litellm_master_key }}"
                  # Route openai/ prefix models through chat/completions instead of
                  # the Responses API path, which has a bug in LiteLLM 1.82.6 where
                  # AnthropicResponsesStreamWrapper emits message_start twice
                  # (once as eager fallback in __anext__, once via response.created event).
                  # This fixes the "Unexpected event order" error in OpenClaw's stream parser.
                  - name: LITELLM_USE_CHAT_COMPLETIONS_URL_FOR_ANTHROPIC_MESSAGES
                    value: "true"
                volumeMounts:
                  - name: config-volume
                    mountPath: /app/config.yaml
                    subPath: config.yaml
                args:
                  - --config
                  - /app/config.yaml
                  - --port
                  - "4000"
            volumes:
              - name: config-volume
                configMap:
                  name: litellm-proxy-config

- name: Create LiteLLM proxy Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm-proxy
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm-proxy # Label for ServiceMonitor discovery
      spec:
        selector:
          app: litellm-proxy
        ports:
          - name: metrics
            protocol: TCP
            port: 4000
            targetPort: 4000
        type: ClusterIP

- name: Check if monitoring namespace exists
  ansible.builtin.command:
    cmd: kubectl get namespace monitoring
  register: litellm_monitoring_ns
  changed_when: false
  failed_when: false

- name: Create LiteLLM ServiceMonitor
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: litellm-proxy-metrics
        namespace: "{{ litellm_namespace }}"
        labels:
          app: litellm-proxy
          release: kube-prometheus-stack
      spec:
        selector:
          matchLabels:
            app: litellm-proxy
        endpoints:
          - port: metrics
            path: /metrics
            interval: 30s
  when: litellm_monitoring_ns.rc == 0

- name: Create LiteLLM Grafana dashboard ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: litellm-ai-traffic-dashboard
        namespace: monitoring
        labels:
          grafana_dashboard: "1"
      data:
        litellm-ai-traffic.json: |
          {% raw %}
          {
            "uid": "litellm-ai-traffic",
            "title": "LiteLLM AI Traffic",
            "annotations": { "list": [] },
            "description": "LiteLLM AI traffic — requests, latency, tokens, spend per model. Models: openclaw-gemini=OpenClaw, hermes-qwen=Hermes, holmes-llama=Holmes, kagent-orchestrator=Kagent",
            "editable": true,
            "graphTooltip": 1,
            "id": null,
            "panels": [
              {
                "datasource": { "type": "prometheus", "uid": "${datasource}" },
                "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "reqps" } },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "id": 1,
                "targets": [
                  { "expr": "sum by (requested_model) (rate(litellm_requests_metric_total[5m]))", "legendFormat": "{{requested_model}}", "refId": "A" }
                ],
                "title": "📊 Requests/s by Model (service)",
                "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${datasource}" },
                "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "s" } },
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "id": 2,
                "targets": [
                  { "expr": "histogram_quantile(0.95, sum by (requested_model,le) (rate(litellm_request_total_latency_metric_bucket[5m])))", "legendFormat": "p95 {{requested_model}}", "refId": "A" },
                  { "expr": "histogram_quantile(0.50, sum by (requested_model,le) (rate(litellm_request_total_latency_metric_bucket[5m])))", "legendFormat": "p50 {{requested_model}}", "refId": "B" }
                ],
                "title": "⏱ Latency p50/p95 by Model",
                "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${datasource}" },
                "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" } },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "id": 3,
                "targets": [
                  { "expr": "sum by (requested_model) (rate(litellm_total_tokens_metric_total[5m]))", "legendFormat": "{{requested_model}}", "refId": "A" }
                ],
                "title": "🔢 Tokens/s by Model",
                "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${datasource}" },
                "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "currencyUSD", "decimals": 5 } },
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
                "id": 4,
                "options": { "reduceOptions": { "calcs": ["sum"] }, "orientation": "horizontal", "colorMode": "background" },
                "targets": [
                  { "expr": "sum by (requested_model) (litellm_spend_metric_total)", "legendFormat": "{{requested_model}}", "refId": "A" }
                ],
                "title": "💰 Total Spend by Model (USD)",
                "type": "bargauge"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${datasource}" },
                "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "reqps" } },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
                "id": 5,
                "targets": [
                  { "expr": "sum by (requested_model) (rate(litellm_requests_metric_total{status_code!~\"2..\"}[5m]))", "legendFormat": "err {{requested_model}}", "refId": "A" }
                ],
                "title": "❌ Error Rate by Model",
                "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${datasource}" },
                "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short" } },
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
                "id": 6,
                "targets": [
                  { "expr": "sum by (fallback_model) (rate(litellm_deployment_successful_fallbacks_total[5m]))", "legendFormat": "→ {{fallback_model}}", "refId": "A" }
                ],
                "title": "🔄 Fallback Activations",
                "type": "timeseries"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${datasource}" },
                "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" }, "unit": "short", "decimals": 0 } },
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
                "id": 7,
                "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "horizontal", "displayMode": "gradient", "showUnfilled": true },
                "targets": [
                  { "expr": "sum by (agent) (label_replace(label_replace(label_replace(label_replace(litellm_requests_metric_total, \"agent\", \"Hermes\", \"requested_model\", \"hermes-qwen|free|free2|cheap|gpt-4o|claude-sonnet|gemini-flash|default\"), \"agent\", \"Holmes\", \"requested_model\", \"holmes-llama|holmes-free2|holmes-cheap|gpt-5.4\"), \"agent\", \"kagent\", \"requested_model\", \"kagent-orchestrator\"), \"agent\", \"OpenClaw\", \"requested_model\", \"openclaw-gemini|gemini-free|gemini-free2\"))", "legendFormat": "{{agent}}", "refId": "A" }
                ],
                "title": "🤖 Total Queries by Agent",
                "type": "bargauge"
              }
            ],
            "refresh": "30s",
            "schemaVersion": 38,
            "tags": ["litellm", "ai", "llm", "openclaw", "hermes", "kagent"]
          }
          {% endraw %}
  when: litellm_monitoring_ns.rc == 0

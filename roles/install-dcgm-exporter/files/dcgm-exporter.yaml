# DCGM-exporter: utilización FÍSICA real de la(s) GPU (NVML/DCGM), complementa a HAMI (que da lo
# ASIGNADO, no el uso real). Ver online-game/docs/sdd-llm-usage-metrics.md (SDD 28).
#
# Coexistencia con HAMI: NO pide `nvidia.com/gpu` → NO consume un vGPU slice ni pasa por HAMI; lee el
# driver directo (runtimeClassName nvidia + privileged). Solo telemetría read-only.
# Placas viejas (P4 6.1 / M4000 5.2): SOLO campos DCGM_FI_DEV_* (los DCGM_FI_PROF_* requieren Volta+
# y harían ruido/errores) → CSV custom recortado.
---
apiVersion: v1
kind: ConfigMap
metadata: { name: dcgm-metrics, namespace: ai }
data:
  custom.csv: |
    DCGM_FI_DEV_GPU_UTIL,        gauge, GPU utilization (%).
    DCGM_FI_DEV_MEM_COPY_UTIL,   gauge, Memory utilization (%).
    DCGM_FI_DEV_FB_USED,         gauge, Framebuffer memory used (MiB).
    DCGM_FI_DEV_FB_FREE,         gauge, Framebuffer memory free (MiB).
    DCGM_FI_DEV_GPU_TEMP,        gauge, GPU temperature (C).
    DCGM_FI_DEV_POWER_USAGE,     gauge, Power draw (W).
    DCGM_FI_DEV_SM_CLOCK,        gauge, SM clock (MHz).
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: dcgm-exporter, namespace: ai, labels: { app: dcgm-exporter } }
spec:
  selector: { matchLabels: { app: dcgm-exporter } }
  template:
    metadata: { labels: { app: dcgm-exporter } }
    spec:
      runtimeClassName: nvidia          # acceso al driver NVIDIA
      nodeSelector: { gpu: "on" }       # solo nodos con GPU
      tolerations:
        - { operator: "Exists" }        # corre aunque el nodo GPU tenga taints
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.9-3.6.1-ubuntu22.04
          args: ["-f", "/etc/dcgm-exporter/custom.csv"]
          env:
            - { name: DCGM_EXPORTER_LISTEN, value: ":9400" }
            - { name: DCGM_EXPORTER_KUBERNETES, value: "true" }   # mapea pod a GPU cuando se puede
          ports:
            - { name: metrics, containerPort: 9400 }
          securityContext:
            privileged: true            # DCGM necesita acceso al device
          volumeMounts:
            - { name: metrics-csv, mountPath: /etc/dcgm-exporter }
          # NO se pide nvidia.com/gpu (no pasa por HAMI).
      volumes:
        - name: metrics-csv
          configMap: { name: dcgm-metrics }
---
apiVersion: v1
kind: Service
metadata: { name: dcgm-exporter, namespace: ai, labels: { app: dcgm-exporter } }
spec:
  selector: { app: dcgm-exporter }
  ports:
    - { name: metrics, port: 9400, targetPort: 9400 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dcgm-exporter
  namespace: ai
  labels: { app: dcgm-exporter, release: kube-prometheus-stack }  # release: → lo descubre Prometheus
spec:
  selector: { matchLabels: { app: dcgm-exporter } }
  endpoints:
    - { port: metrics, interval: 10s }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gpu-dcgm
  namespace: ai
  labels: { grafana_dashboard: "1" }   # el sidecar de Grafana lo descubre por este label
data:
  gpu-dcgm.json: |
    {
      "uid": "gpu-dcgm-live",
      "title": "GPU — DCGM (utilización física en vivo)",
      "tags": ["gpu", "dcgm"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": { "list": [ { "name": "datasource", "type": "datasource", "query": "prometheus", "current": {}, "hide": 0 } ] },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Utilización GPU (%)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100 }, "overrides": [] },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "targets": [ { "refId": "A", "expr": "DCGM_FI_DEV_GPU_UTIL", "legendFormat": "{{modelName}} ({{gpu}})" } ]
        },
        {
          "id": 2, "type": "timeseries", "title": "VRAM usada (MiB)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "decmbytes" }, "overrides": [] },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "targets": [ { "refId": "A", "expr": "DCGM_FI_DEV_FB_USED", "legendFormat": "{{modelName}} ({{gpu}})" } ]
        },
        {
          "id": 3, "type": "timeseries", "title": "Temperatura (°C)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "celsius" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 9 },
          "targets": [ { "refId": "A", "expr": "DCGM_FI_DEV_GPU_TEMP", "legendFormat": "{{modelName}} ({{gpu}})" } ]
        },
        {
          "id": 4, "type": "timeseries", "title": "Consumo (W)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "watt" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 9 },
          "targets": [ { "refId": "A", "expr": "DCGM_FI_DEV_POWER_USAGE", "legendFormat": "{{modelName}} ({{gpu}})" } ]
        },
        {
          "id": 5, "type": "stat", "title": "Util máx (%)",
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100 }, "overrides": [] },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 9 },
          "targets": [ { "refId": "A", "expr": "max(DCGM_FI_DEV_GPU_UTIL)" } ]
        }
      ]
    }

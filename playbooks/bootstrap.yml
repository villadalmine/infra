# Installs the cluster as well as core system components like Cilium, ArgoCD, etc.
# After which, handover.yml is used to delegate the management of these components to ArgoCD
#
# Role order is CRITICAL — see AGENTS.md for full explanation.
# Summary: CRDs before Cilium, Cilium before cilium-pools (LB-IPAM CRDs only exist after Cilium),
#          cert-manager before gateway (wildcard TLS cert must exist),
#          gateway before pihole (HTTPRoute needs gateway to exist).
#
# Tags (cumulative — include all tags up to the layer you need):
#   core               → k3s + kubeconfig + node sysctls
#   networking         → gateway-api-crds + cilium + cilium-pools  (requires core)
#   encryption         → cilium wireguard encryption               (DISABLED: incompatible with LB-IPAM)
#   networking-observability → cilium-hubble-monitoring ServiceMonitor (requires networking + observability)
#   ingress            → cert-manager + gateway                    (requires networking)
#   dns-metrics        → pihole                                    (requires ingress + storage for Pi-hole)
#   services           → argocd + helm-dashboard                   (requires ingress)
#   observability      → prometheus + tempo + loki + alloy         (requires networking + storage for Prometheus/Loki)
#   storage            → storage backends / PVC backends             (requires networking)
#   ai                 → registry + hermes-image + litellm-proxy + hermes-agent  (requires services + storage)
#   openclaw           → OpenClaw personal AI gateway (Telegram + LiteLLM + modular RBAC)
#   ai-registry        → registry only (requires storage)
#   security           → neuvector                                   (requires networking + storage)
#   ai-hermes-build    → kaniko ARM64 image build only
#   ai-hermes-deploy   → LiteLLM proxy + Hermes Agent deploy
#   ai-hermes-agent    → Hermes Agent only
#   ai-holmes          → HolmesGPT HTTP API + Gateway route
#   leloir-build       → kaniko build of leloir-controlplane ARM64 image (requires ai-registry)
#   leloir             → Postgres + leloir-controlplane deploy (requires ai-registry + leloir-build)
#   kagent             → kagent + kmcp operator (multi-tenant AI agent platform)
#   ai-platform        → alias for kagent
#   nas-admin-build    → kaniko build of nas-admin image (requires ai-registry)
#   nas-admin          → NAS admin panel Helm chart deploy at nas-admin.cluster.home
#
# Examples:
#   ansible-playbook bootstrap.yml --tags core
#   ansible-playbook bootstrap.yml --tags core,networking
#   ansible-playbook bootstrap.yml --tags core,networking,ingress,services

- name: System upgrade (apt dist-upgrade, optional release upgrade — NEVER on rk1_nodes)
  hosts: "{{ groups['all'] | difference(groups['rk1_nodes']) }}"
  become: true
  roles:
    - role: apt-upgrade
      tags: [upgrade]

- name: Create partitions and install K3s
  hosts: k3s_nodes
  become: true
  roles:
    #    - create-partition
    - role: install-k3s
      tags: [core]

- name: Get kubeconfig from server and install core components
  hosts: localhost
  gather_facts: true
  environment:
    PATH: "{{ lookup('env','HOME') }}/.asdf/shims:{{ lookup('env','HOME') }}/.asdf/bin:{{ lookup('env','PATH') }}"
  roles:
    - role: get-kubeconfig
      tags: [core]
    - role: install-gateway-api-crds
      tags: [networking]
    - role: install-cilium
      tags: [networking]
    - role: install-cilium-pools
      tags: [networking]
    - role: install-cilium-encryption
      tags: [encryption]
      when: cilium_wireguard_enabled | default(false)
    - role: install-cilium-hubble-monitoring
      tags: [networking-observability]
    - role: install-cert-manager
      tags: [ingress]
    - role: install-gateway
      tags: [ingress]
    - role: install-pihole
      tags: [dns-metrics, pihole]
    - role: install-argo-workflows
      tags: [services, argo-workflows]
    - role: install-argocd
      tags: [services, argocd]
    - role: install-helm-dashboard
      tags: [services, helm-dashboard]
    - role: install-kube-prometheus-stack
      tags: [observability]
    - role: install-tempo
      tags: [observability]
    - role: install-loki
      tags: [observability]
    - role: install-alloy
      tags: [observability]

    - role: install-csi-rclone
      tags: [storage]

    # AI stack (ARM64 build required)
    - role: install-cifs-nas
      tags: [ai, ai-registry]
    - role: install-registry
      tags: [ai, ai-registry]
    - role: install-hermes-agent-image
      tags: [ai, ai-hermes-build]
    - role: run-remote-build
      tags: [ai-hermes-build-remote]
      vars:
        remote_app_name: hermes-agent
        remote_github_workflow: build-hermes.yml
        remote_git_ref: "{{ hermes_git_ref }}"
        remote_image_tag: "{{ hermes_image_tag }}"
        remote_ghcr_image: hermes-agent
        remote_local_registry: "{{ hermes_registry }}"
        remote_local_image_name: "{{ hermes_image_name }}"
    
    - role: run-remote-build
      tags: [leloir-build-remote]
      vars:
        remote_app_name: leloir-controlplane
        remote_github_workflow: build-leloir.yml
        remote_git_ref: "{{ leloir_git_ref | default('main') }}"
        remote_image_tag: "{{ leloir_image_tag | default('latest') }}"
        remote_ghcr_image: leloir-controlplane
        remote_local_registry: "{{ leloir_registry | default('registry.registry:5000') }}"
        remote_local_image_name: "{{ leloir_image_name | default('ai/leloir-controlplane') }}"
    
    - role: run-remote-build
      tags: [nas-admin-build-remote]
      vars:
        remote_app_name: nas-admin
        remote_github_workflow: build-nas-admin.yml
        remote_git_ref: "main"
        remote_image_tag: "latest"
        remote_ghcr_image: nas-admin
        remote_local_registry: "registry.registry:5000"
        remote_local_image_name: "admin/nas-admin"
    - role: install-kubernetes-mcp-server-image
      tags: [ai, ai-kubernetes-mcp-build]
    - role: install-litellm-proxy
      tags: [ai, ai-hermes-deploy, ai-litellm-proxy]
    - role: install-hermes-agent
      tags: [ai, ai-hermes-deploy, ai-hermes-agent]
    - role: install-holmes
      tags: [ai, ai-holmes]
    - role: install-holmes-ui
      tags: [ai, ai-holmes, ai-holmes-ui]
    - role: install-leloir-image
      tags: [leloir-build]
    - role: install-leloir
      tags: [leloir]
    - role: install-dex
      tags: [dex]
    - role: install-kagent
      tags: [kagent, ai-platform]
    - role: install-openclaw
      tags: [openclaw]

    # NAS admin panel — PV/PVC browser + cleanup tool (SMBv1 / LG N2R1)
    - role: install-nas-admin-image
      tags: [nas-admin-build]
    - role: install-nas-admin
      tags: [nas-admin]

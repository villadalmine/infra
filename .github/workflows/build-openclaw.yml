name: Build OpenClaw Honcho Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Target Image Tag'
        required: true
        default: 'latest-honcho'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          FROM ghcr.io/openclaw/openclaw:latest
          # Install Honcho plugin at image build time
          RUN openclaw plugins install @honcho-ai/openclaw-honcho
          EOF

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/openclaw-honcho:${{ github.event.inputs.image_tag }}
          cache-from: type=gha
      - name: Send Webhook to OpenClaw via Smee.io
        if: always()
        run: |
          curl -X POST https://smee.io/NibMMS9tqGdtxzN1 \
          -H "Authorization: Bearer ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"event": "github_action", "repo": "${{ github.repository }}", "workflow": "${{ github.workflow }}", "status": "${{ job.status }}"}'

name: Build Leloir Controlplane

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git Ref for villadalmine/leloir'
        required: true
        default: 'main'
      image_tag:
        description: 'Target Image Tag'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Leloir Repo
        uses: actions/checkout@v4
        with:
          repository: villadalmine/leloir
          ref: ${{ github.event.inputs.git_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: leloir-core/Dockerfile.controlplane
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/leloir-controlplane:${{ github.event.inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

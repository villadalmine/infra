# ArgoCD Application: install the Cluster API Operator (Helm).
# The operator turns "install a CAPI provider" into a declarative CR you keep in Git.
# sync-wave 0 → operator first; the provider CRs (20-...) are wave 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-api-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/cluster-api-operator
    chart: cluster-api-operator
    targetRevision: "0.21.0"        # check: helm search repo capi-operator/cluster-api-operator
    helm:
      values: |
        # The operator needs cert-manager; this cluster already runs jetstack
        # cert-manager, so let the operator detect and reuse it.
        cert-manager:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: capi-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

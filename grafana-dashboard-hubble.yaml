apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hubble
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    # la etiqueta "grafana_dashboard" activa el sidecar de Grafana
    app.kubernetes.io/managed-by: ansible
    # opcional: referencia al dashboard original
    dashboard-source: "hubble-dashboard.json"

data:

# inventory/hosts
# IPs updated from MikroTik DHCP scan 2026-05-21 (cluster reinstalled fresh)
# super6c-node3 not detected in scan — offline or needs reimaging
#
# HA control plane (3 masters, embedded etcd):
#   server_nodes      → srv-super6c-01-nvme  — the cluster-init node (etcd bootstrap)
#   server_join_nodes → srv-super6c-02/04-nvme — additional control planes (NVMe)
# The eMMC super6c nodes are workers (eMMC is poor for etcd WAL); the agents reach
# the API through the HAProxy VIP (k3s_ha_vip) on srv-pi-rack2b.

[all]
# Super6C CM4 nodes (aarch64, 4 cores, 7.6GB RAM)
srv-super6c-01-nvme ansible_host=192.168.178.120
srv-super6c-02-nvme ansible_host=192.168.178.121
# srv-super6c-03-nvme ansible_host=TBD  # missing from DHCP scan — offline
srv-super6c-04-nvme ansible_host=192.168.178.122
srv-super6c-05-emmc ansible_host=192.168.178.124
srv-super6c-06-emmc ansible_host=192.168.178.123

# TuringPi 2 RK1 nodes (K3s agents — aarch64, 8 cores, 31GB RAM, 477GB NVMe)
srv-rk1-nvme-01 ansible_host=192.168.178.131
srv-rk1-nvme-02 ansible_host=192.168.178.48
srv-rk1-nvme-03 ansible_host=192.168.178.51
srv-rk1-nvme-04 ansible_host=192.168.178.54

# GPU / x86 node (K3s agent — x86_64, 32 cores dual Xeon E5-2667v4, 30GB RAM, Tesla P4 + Quadro M4000)
srv-t7910 ansible_host=192.168.178.90

# Raspberry Pi 4 nodes (K3s agents — aarch64, 4 cores, 8GB RAM)
srv-pi-rack1    ansible_host=192.168.178.65
srv-pi-rack2a   ansible_host=192.168.178.40
srv-pi-rack2b   ansible_host=192.168.178.130

# Control-plane: the single cluster-init / embedded-etcd bootstrap node.
[server_nodes]
srv-super6c-01-nvme

# Control-plane: additional masters that join the embedded-etcd cluster (NVMe only).
[server_join_nodes]
srv-super6c-02-nvme
srv-super6c-04-nvme

[agent_nodes]
# eMMC super6c nodes — workers (not control plane; eMMC unsuited to etcd WAL).
srv-super6c-05-emmc
srv-super6c-06-emmc
srv-rk1-nvme-01
srv-rk1-nvme-02
srv-rk1-nvme-03
srv-rk1-nvme-04
srv-t7910
srv-pi-rack1
srv-pi-rack2a
srv-pi-rack2b

[rk1_nodes]
srv-rk1-nvme-01
srv-rk1-nvme-02
srv-rk1-nvme-03
srv-rk1-nvme-04

[gpu_nodes]
srv-t7910

[pi_nodes]
srv-pi-rack1
srv-pi-rack2a
srv-pi-rack2b

# Masters that physically have an NVMe disk → etcd data dir goes on NVMe.
# (super6c-04 has NO NVMe and stays on eMMC; super6c-03 with the 3rd NVMe is offline.)
[etcd_nvme_nodes]
srv-super6c-01-nvme
srv-super6c-02-nvme

# Node running HAProxy as the K3s control-plane API VIP (k3s_ha_vip).
# Must be a stable, always-on node that is NOT a control plane.
[haproxy_nodes]
srv-pi-rack2b

[tailscale_nodes]
# Node acting as Tailscale subnet router for remote access.
# Recommended: srv-super6c-02-nvme (idle CM4, not running K3s)
# DO NOT use srv-super6c-01-nvme (master — already overloaded)
# Uncomment one node when you need remote access:
# srv-super6c-02-nvme
srv-pi-rack1

[k3s_nodes:children]
server_nodes
server_join_nodes
agent_nodes

[all:vars]
ansible_user=dalmine
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=auto_silent
# HA control-plane VIP (HAProxy on srv-pi-rack2b). Single source of truth — consumed
# by install-k3s (agent --server, --tls-san) and get-kubeconfig (external API endpoint).
k3s_ha_vip=192.168.178.130
